// The inspector contract, version 3: what a graphical client may ask of a running
// simulation, and what it is answered with.
//
// One RPC per use case of looper-core, and the data transfer objects of
// those use cases as messages. A client built against this file knows
// nothing of how the answers are produced -- today by the Python use
// cases behind `looper-cli run`, tomorrow perhaps by something else
// serving the same file.
//
// Two rules keep it that way:
//
// 1. A message carries what a client shows, not what it would have to
//    work out. Wherever the application layer offers a derived value --
//    a display text, a range, whether a bus takes messages -- the
//    message carries it as a field, so that no client re-implements a
//    rule of the domain.
// 2. Nothing here names an implementation. No Python type, no adapter,
//    no table of the simulation's own protocol.
//
// Errors are gRPC status codes, and only two kinds matter to a client:
//
//   FAILED_PRECONDITION  The request was refused and the reason is in
//                        the message: a value a variable cannot hold, a
//                        bus that takes no messages, a build that cannot
//                        be read. The client says so and carries on.
//   anything else        The simulation can no longer be read. The
//                        client stops asking.
//
// The server keeps nothing about a client, so any number of them may be
// connected at once. What a client chooses to see -- how much of the
// timeline, which bus as a ladder, where it has read the recordings up
// to -- travels with its request. What the simulation recorded is kept
// once, for every client. What changes the simulation itself -- a
// driven pin, a signal, a watch, following the call paths -- is shared,
// because there is one simulation.

// Version 3 in one paragraph: simulated time is the only clock. Every time
// in a message is `sim_us`, whole microseconds of simulated time, or, for the
// timing and profile messages, `host_ns`, a duration measured on the computer
// running the simulation, which is never a position on the time axis. Every
// change is answered with an `Ack` that says at which simulated time it took
// effect. What was recorded is one stream in one order, `Subscribe`d to or
// read a page at a time, and the views the server builds from it say which
// part of it they cover. A run is controlled with `ControlRun`, not stepped by
// whoever polls. There is no compatibility with version 2.
//
// Refusals are part of the answer rather than a status code: the `Ack` of a
// change says REFUSAL_* and why. A status code is left for a server that
// cannot answer at all.

syntax = "proto3";

package looper.inspector.v3;


enum ContractVersion {
  CONTRACT_VERSION_UNSPECIFIED = 0;
  // 3: time is simulated time and nothing else (sim_us); one ordered event
  //    stream replaces the four recordings; every change is acknowledged
  //    with the simulated time it took effect at.
  CONTRACT_VERSION_CURRENT = 3;
}

message Empty {}

// The order a server accepted a change in, and what happened to it.
message Ack {
  // Global, assigned by the server in arrival order; never reused.
  uint64 command_seq = 1;
  // Simulated time of the boundary the change took effect at, or, when
  // `pending`, will take effect at (exact: events cut idle waits). Zero and
  // meaningless when `refusal` is not NONE.
  uint64 applied_at_us = 2;
  // Accepted but not applied yet: `when` lies ahead, or a HELD run is under
  // way. The CommandApplied event reports the application.
  bool pending = 7;
  // The recording epoch after the call. Bumped by ClearRecordings only.
  uint64 epoch = 3;
  Refusal refusal = 4;
  // Why, in words a person is shown, when refused; empty otherwise.
  string refusal_text = 5;
  // Set when `when.at_us` was in the past and `allow_late` applied it at
  // once: how many microseconds late it was.
  uint64 late_by_us = 6;
}

enum Refusal {
  REFUSAL_NONE = 0;
  REFUSAL_LATE = 1;            // `at_us` is before the simulation's time
  REFUSAL_UNKNOWN_TARGET = 2;  // no such bus, channel, pin, job
  REFUSAL_NOT_ACCEPTED = 3;    // the target takes no such change (a master bus)
  REFUSAL_QUEUE_FULL = 4;      // the bus controller's queue holds no more
  REFUSAL_WRONG_EPOCH = 5;     // a call that names an epoch named an old one
  REFUSAL_INVALID = 6;         // a value out of range; `refusal_text` says which
  REFUSAL_WRONG_MODE = 7;      // run_for while PACED, and the like
  REFUSAL_OTHER = 8;
  REFUSAL_RESETTING = 9;       // not sent at present: calls wait for the next life
}

// When a change is to take effect. Absent: at the next boundary.
message When {
  oneof at {
    uint64 at_us = 1;      // an absolute simulated time
    uint64 after_us = 2;   // from the boundary the server accepts it at; the
                           // command log holds the absolute time
  }
  // Apply at once if `at_us` is already past, and say so in the Ack. Not
  // valid with `after_us`. In PACED and MAX an absolute `at_us` is almost
  // always late by the time it arrives; use `after_us` there.
  bool allow_late = 3;
}

message Description {
  ContractVersion contract_version = 1;
  string firmware_name = 2;
  bool reads_the_build = 4;
  string definition_path = 5;
  // Optional features this server has. An enum, not strings: a typo is a
  // compile error, and an unknown number from a newer server is kept.
  repeated Capability capabilities = 6;
  // How far back the server can resume a stream, and the largest page.
  uint64 retention_us = 7;
  uint32 max_events_per_batch = 8;
  // What the server serves: a running simulation, or a project's code
  // without one (`looper-cli inspect`), where only CAPABILITY_SOURCES and
  // CAPABILITY_ARCHITECTURE are answered and every other call is refused
  // with FAILED_PRECONDITION.
  ServerMode mode = 9;
  string mode_text = 10;      // e.g. "Static analysis - no simulation"
  string input_text = 11;     // e.g. "compile_commands.json, 5 files"
  // What the licence allows, decided once when the server started. A call
  // into a Pro part the licence does not unlock is refused with
  // PERMISSION_DENIED and a sentence saying what is locked and why.
  LicenseView license = 12;
  // Every RPC this session refuses, with the sentence it is refused with, so
  // that a client greys out what is not offered before it asks. A call
  // locked by the licence is not listed: LicenseView says that.
  repeated RefusedCall refused_calls = 13;
  reserved 3;
  reserved "time_mode";
}

message RefusedCall {
  string rpc = 1;   // the method's name in this schema, e.g. "ObserveSimulation"
  string text = 2;  // e.g. "Driving pins is only offered in a simulation: a board's pins are wired."
}

enum Edition {
  EDITION_FREE = 0;
  EDITION_PRO = 1;
}

// A part of looper that needs a licence. A licence file names them in its
// `features` by ProPartView.name; one naming none unlocks all of them.
enum ProFeature {
  PRO_FEATURE_UNSPECIFIED = 0;
  PRO_FEATURE_ARCHITECTURE = 1;   // graph, findings, rules, baseline, machines, call tree, sequences
  // Images and their variants, partition headers, boot.jump, boot chains,
  // the OTP and the power cut. Partition names stay free.
  PRO_FEATURE_BOOTLOADER = 2;
  // Findings from the run: interrupts masked too long, lost, an ISR longer
  // than its period, DMA overruns and length errors, reading while DMA
  // writes; the race mode and the checks of looper-py on them.
  PRO_FEATURE_RUN_FINDINGS = 3;
  // Chains that answer or test: Bus reply, a Bus send behind a Bus received,
  // message fields, injected faults, sequences, the pytest export.
  PRO_FEATURE_SCENARIOS = 4;
  // A board at a debug probe: flashing, reset, halt, resume and its globals
  // (looper-srv's hardware session). looper-core never answers it.
  PRO_FEATURE_HARDWARE = 5;
}

message LicenseView {
  Edition edition = 1;
  repeated ProFeature unlocked = 2;  // what may be used now
  string licensee = 3;               // "" without a licence
  string expires_text = 4;           // e.g. "31 Dec 2027"
  string source_text = 5;            // where the licence was read from
  string note = 6;                   // why it is free, or that it ran out and Pro stops soon
  string install_path = 7;           // where a licence is installed for this user (~/.looper/license.toml)
  repeated ProPartView parts = 8;    // every Pro part this server knows, unlocked or not
}

// One part of looper Pro, as the Licence window lists it.
message ProPartView {
  ProFeature feature = 1;
  string name = 2;         // what a licence file's `features` calls it, e.g. "run-findings"
  string title = 3;        // e.g. "Run findings"
  bool unlocked = 4;       // may be used now
  string locked_text = 5;  // the sentence a call into it is refused with; "" while unlocked
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_PACED = 1;
  CAPABILITY_JOBS = 2;
  CAPABILITY_BUS_TIME = 3;
  CAPABILITY_REPLY_RULES = 4;
  CAPABILITY_DEVICE_ACTIONS = 5;
  CAPABILITY_SOURCES = 6;          // ListSources, ReadSource, ObserveSemantics
  CAPABILITY_LINE_COUNTS = 7;      // a counting build: ObserveLineCounts, ObserveCoverage
  CAPABILITY_DEBUGGER = 8;         // ObserveDebugger, ControlDebugger
  CAPABILITY_LEVELS = 9;           // ReadEventsRequest.with_levels, Subscription.with_levels
  CAPABILITY_READ_BY_TIME = 10;    // ReadEventsRequest.from_us / to_us; EventFilter.pin_ids, call_functions
  CAPABILITY_TRIGGERS = 11;        // ArmTrigger, DisarmTrigger, ObserveTriggers
  CAPABILITY_ARCHITECTURE = 12;    // the project's code index: metrics, dependencies, findings
  CAPABILITY_RESET = 13;           // ResetFirmware, ObserveLives, ReadLifeDump, ObserveRetained, WriteRetained
  CAPABILITY_FLASH = 14;           // ObserveFlash, WriteFlash, EraseFlash, SaveFlash, LoadFlash
  CAPABILITY_BOOT = 15;            // several [[images]], and Pro: ObserveImages, ObserveBootChain, CutPower, ObserveOtp, BurnOtp
  CAPABILITY_INTERRUPTS = 16;      // ObserveInterrupts, RaiseInterrupt, InterruptEvent in the stream
  CAPABILITY_DMA = 17;             // ObserveDma, DmaEvent in the stream
  CAPABILITY_DMA_GUARD = 18;       // this platform can tell a read of a buffer a DMA channel still writes
  CAPABILITY_CHAINS = 19;          // chains in ApplySignalGraph, CheckSignalGraph, ObserveChains, SwitchChainGroup, ListChainBlocks, ChainFire
  CAPABILITY_HARDWARE = 20;        // a board at a debug probe: FlashFirmware, ObserveTarget, hold and resume through ControlRun
}

enum ServerMode {
  SERVER_MODE_SIMULATION = 0;
  SERVER_MODE_STATIC = 1;
  // A board at a debug probe (`looper-srv hardware`). Every time is the
  // target's own: the DWT cycle counter turned into microseconds where the
  // core has one, otherwise the host's time since attaching (mode_text says
  // which). What a board cannot do is refused with FAILED_PRECONDITION.
  SERVER_MODE_HARDWARE = 2;
}

enum ClockMode {
  CLOCK_MODE_HELD = 0;   // advances only when told (RunFor / RunUntil / Step)
  CLOCK_MODE_PACED = 1;  // follows `pace_ratio` times the host's speed, may slip
  CLOCK_MODE_MAX = 2;    // as fast as the computer allows, no pacing
}

message RunControl {
  oneof op {
    Empty hold = 1;            // HELD: stop at the next boundary
    uint64 run_for_us = 3;     // HELD: advance exactly this far, then hold
    uint64 run_until_us = 4;   // HELD: advance to exactly this time
    Empty step_pass = 5;       // HELD: one pass
    double pace_ratio = 6;     // PACED at this speed (1.0 = as real time)
    Empty max_speed = 7;       // MAX
    // 2 (release) is gone: leaving HELD names the mode it goes to.
  }
}

message RunReply { Ack ack = 1; RunState state = 2; }

message RunState {
  // In SERVER_MODE_HARDWARE the target's time, not simulated time (see ServerMode).
  uint64 now_us = 1;
  ClockMode mode = 2;
  double pace_ratio = 3;
  // PACED only. Reported, never fed into the simulation:
  uint64 behind_us = 4;    // simulated time owed to the pace right now
  uint64 slipped_us = 5;   // simulated time given up by re-anchoring after stalls, since the pace was last set
  uint64 epoch = 6;
  uint64 next_event_seq = 7;
  // The pass cost: the simulated time one idle pass takes. A project setting;
  // every command, poll and AdvanceTime is quantised to it.
  uint32 pass_cost_us = 8;
  // HELD with a run under way: where it ends. Zero when standing.
  uint64 target_us = 9;
  // Commands waiting for the end of that run.
  uint32 queued_commands = 10;
  // Why the simulation answers nothing right now: a debugger stopped the
  // firmware at a line. Simulated time stands still meanwhile; `now_us` is
  // where it stands. Empty while it runs. Also a firmware that hangs without
  // a role call and no watchdog to reset it: "The firmware hangs ...".
  // Always empty on a board: a halted core still answers, and why it is
  // halted is TargetView.halt_reason_text; mode HELD says that it stands.
  string hold_reason = 11;
  // The firmware's life: 1 until its first reset, then one more per reset
  // (a reset is not a restart: time and the recording go on). resets is how
  // many there were in this run; life_text says it for the status bar, empty
  // before the first reset ("RST 3 · watchdog").
  uint32 life = 12;
  uint32 resets = 13;
  // During a reset loop "RST 23 · reset loop", in the server's words.
  string life_text = 14;
  // Unset: no watchdog was started in this run (a client shows no watchdog
  // at all). Set with running false: started in an earlier life, not in
  // this one ("Not started in this life.").
  WatchdogState watchdog = 15;
  // The reset loop finding as a sentence, as LifeList.loop_finding; empty
  // when there is none. Its presence is the state: a client marks the
  // life chip as a warning and shows the sentence as its tooltip.
  string reset_loop_text = 16;
  // A power cut that is armed (Pro), in the server's words: "power cut armed:
  // after 4096 bytes of a flash write". Empty when none is; its presence is
  // the state, as with hold_reason.
  string power_cut_text = 17;
}

// The watchdog of the running life, as the runtime last noted it. Every
// time is simulated time; the texts and the stage are the server's.
message WatchdogState {
  bool running = 1;            // started in this life
  uint64 timeout_us = 2;
  uint64 last_kick_us = 3;     // the start, while no kick came
  uint64 deadline_us = 4;      // last_kick_us + timeout_us
  uint64 remaining_us = 5;     // deadline_us - now_us, never below 0
  uint32 kicks = 6;            // in this life
  bool is_close = 7;           // little time is left, by the server's rule
  string remaining_text = 8;   // "1.62 s"; a chip puts "WDT" in front
  string last_kick_text = 9;   // "29.861 s (0.38 s ago)"
  // "Watchdog: timeout 2.000 s, last kicked at 29.861 s. Resets the
  // firmware if not kicked within 1.62 s."
  string text = 10;
}

message Subscription {
  // Resume after a break: the epoch and the first event_seq wanted. Epoch
  // zero means "from now". `event_seq` keeps counting across epochs, so a
  // resume with an old epoch gets `epoch_changed` and the new epoch's start.
  // A `from_event_seq` older than the server keeps is answered with a Lost
  // (RETENTION) and then the oldest it has; one beyond the end is INVALID.
  uint64 epoch = 1;
  uint64 from_event_seq = 2;
  EventFilter filter = 3;
  // Also say, in the first batch and in every batch with epoch_changed, what
  // every pin and sampled channel stood at just before its first event.
  bool with_levels = 4;
}

message ReadEventsRequest {
  uint64 epoch = 1;
  uint64 from_event_seq = 2;
  uint32 max_events = 3;
  EventFilter filter = 4;
  // Also say what every pin and sampled channel stood at just before the
  // first event of this page. A client asks on its first page and after
  // epoch_changed.
  bool with_levels = 5;
  // Start at the first event at or after this simulated time instead of
  // from_event_seq (sim_us never decreases along event_seq). Older than the
  // server keeps: Lost (RETENTION) and the oldest kept, as for from_event_seq.
  optional uint64 from_us = 6;
  // Stop before the first event at or after this simulated time.
  optional uint64 to_us = 7;
}

message EventFilter {
  // Empty means every kind.
  repeated EventKind kinds = 1;
  repeated uint32 channel_ids = 2;   // for samples
  repeated uint32 bus_ids = 3;       // for exchanges
  // Keep only every n-th sample per channel (0 or 1: all). A presentation
  // convenience; the full-rate stream stays in the server's log.
  uint32 sample_stride = 4;
  repeated uint32 pin_ids = 5;          // for pin changes; empty: every pin
  repeated string call_functions = 6;   // for calls; empty: every function
  repeated uint32 interrupt_ids = 7;    // for interrupt events; empty: every source and the lock
  repeated uint32 dma_ids = 8;          // for DMA events; empty: every channel
  repeated uint32 chain_ids = 9;        // for chain fires; empty: every chain
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_SAMPLE = 1;
  EVENT_KIND_PIN = 2;
  EVENT_KIND_EXCHANGE = 3;
  EVENT_KIND_CALL = 4;       // the journal of firmware calls
  EVENT_KIND_COMMAND = 5;    // a change that was applied
  EVENT_KIND_JOB = 6;        // a job started, stopped, sent, was late
  EVENT_KIND_FAULT = 7;      // a model stopped, a wait failed
  EVENT_KIND_RUN = 8;        // a run reached its target; held; slipped (PACED)
  EVENT_KIND_TRIGGER = 9;    // a trigger fired, or was disarmed
  EVENT_KIND_RESET = 10;     // a reset (ResetMark) and the life it began (LifeMark)
  EVENT_KIND_FLASH = 11;     // a flash write, erase, or a write against its rules (FlashMark)
  EVENT_KIND_INTERRUPT = 12; // an interrupt source pending, an ISR entered and left, lost, a lock (InterruptEvent)
  EVENT_KIND_DMA = 13;       // a DMA transfer started, reached its half or end, overran, was touched (DmaEvent)
  // 14 is kept for the watchdog's history (WatchdogMark), not served yet.
  EVENT_KIND_CHAIN = 15;     // a block of a chain fired, acted, stepped, ended, failed (ChainFire)
}

message EventBatch {
  uint64 epoch = 1;
  repeated Event events = 2;
  // Ranges this client will not get, exact in event_seq and sim_us. Per
  // client: other clients may have them. The server's own log is lossless up
  // to its retention (HELD and MAX stop the run before the ring overflows).
  repeated Lost lost = 3;
  // First event_seq the client should ask for next.
  uint64 next_event_seq = 4;
  // The simulation's time when this batch was cut; a client can draw the
  // axis up to here even when no event happened.
  uint64 sim_now_us = 5;
  // Set when the epoch changed since the client's last batch: it empties its
  // store and starts from this batch.
  bool epoch_changed = 6;
  // Only when asked (with_levels): what stood before the first event.
  LevelsBefore levels = 7;
}

// What stood just before an event. A pin or channel not recorded in this
// epoch is absent: unknown, not low. Pins are exact over the whole epoch;
// a channel is told from the last sample among the newest events the
// server keeps before that event (a channel sampled rarely may be absent).
message LevelsBefore {
  uint64 before_event_seq = 1;
  repeated PinLevelSince pins = 2;
  repeated ChannelValueSince channels = 3;
}
message PinLevelSince { uint32 pin_id = 1; bool high = 2; uint64 since_us = 3; }
message ChannelValueSince { uint32 channel_id = 1; double value = 2; uint64 since_us = 3; }

message Event {
  uint64 event_seq = 1;  // total order, never reused
  uint64 sim_us = 2;
  oneof body {
    Sample sample = 3;
    PinChange pin = 4;
    Exchange exchange = 5;
    Call call = 6;
    CommandApplied command = 7;
    JobEvent job = 8;
    Fault fault = 9;
    RunEvent run = 10;
    TriggerFired trigger_fired = 11;
    TriggerDisarmed trigger_disarmed = 12;
    ResetMark reset = 14;
    LifeMark life = 15;
    FlashMark flash = 16;
    InterruptEvent interrupt = 17;
    DmaEvent dma = 18;
    // 19 is kept for the watchdog's history (WatchdogMark).
    ChainFire chain = 20;
  }
  // 13 is the simulation's record of a call between lifelines, which the
  // server keeps for ObserveSequence and does not serve as a body.
  reserved 13;
}

// The firmware's life ended by a reset at Event.sim_us. Its outputs went to
// their reset levels at that moment; the next life begins at the same time.
message ResetMark {
  ResetCause cause = 1;
  string cause_text = 2;       // "watchdog", "software", "pin", "power-on", "brown-out"
  uint32 life = 3;             // the life that ended
  LifeEndReason reason = 4;
  uint64 jump_target = 5;      // a jump (Pro): the address the firmware gave
  // The life that ended, said with how long it lasted, in the words of
  // LifeView.text: "Life 3 ended after 2.104 s · watchdog".
  string text = 6;
}

// A life began, at Event.sim_us.
message LifeMark {
  uint32 life = 1;
  string image = 2;            // with several images (Pro); empty otherwise
  string partition = 3;
  EnteredBy entered_by = 4;
  string text = 5;             // "life 3 · after watchdog"
}

// A flash operation, at Event.sim_us. offset from the flash's beginning.
message FlashMark {
  FlashMarkKind kind = 1;
  uint64 offset = 2;
  uint32 length = 3;
  string partition = 4;        // empty outside every partition
  ChangeSource source = 5;
}

// What an interrupt source or the lock did, at Event.sim_us. Facts in
// simulated time: latency from due to the ISR's start, the ISR's own
// duration (it is longer than nothing only when it waits), the lock's
// section. host_ns is the host's time inside the ISR, information only.
message InterruptEvent {
  uint32 source_id = 1;        // the source's number; 0 with LOCKED is the global lock
  InterruptEventKind kind = 2;
  uint64 latency_us = 3;       // ENTERED
  uint64 duration_us = 4;      // LEFT; LOCKED, whose event stands at the section's end
  uint64 host_ns = 5;          // LEFT
  uint64 lost = 6;             // LOST: how many so far
  Source cause = 7;            // PENDING: who made it due
  uint64 point = 8;            // ENTERED: the firmware's address it interrupted; LOCKED: where the lock was taken
  uint32 line = 9;             // STORM: the line that was shut
  bool by_race = 10;           // raised by the race mode (Pro)
  CodePlace place = 11;        // the point as a place in the code, where the server resolves it; not in the stream
}

enum InterruptEventKind {
  INTERRUPT_EVENT_PENDING = 0;
  INTERRUPT_EVENT_ENTERED = 1;
  INTERRUPT_EVENT_LEFT = 2;
  INTERRUPT_EVENT_LOST = 3;    // due again while its pending bit was set
  INTERRUPT_EVENT_LOCKED = 4;  // a section of the global lock ended, from 1 us
  INTERRUPT_EVENT_STORM = 5;   // entered too often at one time: its line is shut
}

// A DMA channel did something, at Event.sim_us. The numbers are the
// simulation's own, so the server passes the events through: position and
// lap where the channel stood, the access the guard caught with the
// instruction (pc) and what it touched. A read of the buffer is caught only
// with the licence (RUN_FINDINGS) and CAPABILITY_DMA_GUARD.
message DmaEvent {
  uint32 dma_id = 1;           // the channel's number, its place in contract.toml plus one
  DmaEventKind kind = 2;
  uint64 address = 3;          // START: the buffer
  uint32 length = 4;           // START: elements
  uint32 width = 5;            // START: bytes per element
  uint32 position = 6;         // the element the channel writes next
  uint64 lap = 7;              // a circular channel's laps so far
  DmaAccess access = 8;        // ACCESS
  bool write = 9;              // ACCESS: a write, not a read
  uint64 pc = 10;              // ACCESS: the firmware's instruction
  uint64 access_address = 11;  // ACCESS: what it touched
  uint64 count = 12;           // UNCLAIMED: bytes nobody took; IDLE: the count the ISR is given
  bool on_stack = 13;          // START: the buffer is on the stack
  DmaGuardOff reason = 14;     // GUARD_OFF
  CodePlace place = 15;        // ACCESS: pc as a place in the code, where the server resolves it; not in the stream
  string text = 16;            // the sentence, where the server writes one; not in the stream
}

enum DmaEventKind {
  DMA_EVENT_START = 0;
  DMA_EVENT_HALF = 1;
  DMA_EVENT_COMPLETE = 2;
  DMA_EVENT_IDLE = 3;          // the line went idle: the transfer ends with what it has
  DMA_EVENT_STOPPED = 4;
  DMA_EVENT_OVERRUN = 5;       // a half came while the ISR of the one before had not ended
  DMA_EVENT_ACCESS = 6;        // the firmware touched the buffer while the channel ran
  DMA_EVENT_UNCLAIMED = 7;     // bytes arrived and no transfer took them
  DMA_EVENT_GUARD_OFF = 8;     // the guard over the buffer stopped; reason says why
}

enum DmaAccess {
  DMA_ACCESS_UNSPECIFIED = 0;
  DMA_ACCESS_UNWRITTEN = 1;    // read an element the channel has not written yet
  DMA_ACCESS_UNANNOUNCED = 2;  // read an element written but not yet announced by half, end or idle
  DMA_ACCESS_CONFLICT = 3;     // wrote what the channel still writes
  DMA_ACCESS_OVERWRITE = 4;    // the channel wrote over what the firmware had not read
}

enum DmaGuardOff {
  DMA_GUARD_OFF_UNSPECIFIED = 0;
  DMA_GUARD_OFF_BUDGET = 1;      // the neighbours trapped too often: the guard went coarse
  DMA_GUARD_OFF_DEBUGGER = 2;    // a debugger is attached
  DMA_GUARD_OFF_STACK = 3;       // the buffer is on the stack
  DMA_GUARD_OFF_UNAVAILABLE = 4; // the platform cannot guard pages
}

enum FlashMarkKind {
  FLASH_MARK_UNSPECIFIED = 0;
  FLASH_MARK_WRITE = 1;
  FLASH_MARK_ERASE = 2;
  FLASH_MARK_VIOLATION = 3;    // a write or erase against the rules; a Fault says which
  FLASH_MARK_CUT = 4;          // a power cut while programming (Pro)
}

enum ChangeSource {
  CHANGE_SOURCE_UNSPECIFIED = 0;
  CHANGE_SOURCE_FIRMWARE = 1;
  CHANGE_SOURCE_CLIENT = 2;
}

enum ResetCause {
  RESET_CAUSE_UNSPECIFIED = 0;
  RESET_CAUSE_POWER_ON = 1;
  RESET_CAUSE_SOFTWARE = 2;
  RESET_CAUSE_WATCHDOG = 3;
  RESET_CAUSE_PIN = 4;
  RESET_CAUSE_BROWN_OUT = 5;
}

enum LifeEndReason {
  LIFE_END_REASON_UNSPECIFIED = 0;
  LIFE_END_REASON_RESET = 1;
  LIFE_END_REASON_JUMP = 2;
  LIFE_END_REASON_POWER_CUT = 3;
}

enum EnteredBy {
  ENTERED_BY_UNSPECIFIED = 0;
  ENTERED_BY_RESET = 1;
  ENTERED_BY_JUMP = 2;
  ENTERED_BY_POWER_ON = 3;
}

message Lost {
  uint64 from_event_seq = 1;
  uint64 to_event_seq = 2;
  uint64 from_us = 3;
  uint64 to_us = 4;
  LossReason reason = 5;
}

enum LossReason {
  LOSS_REASON_UNSPECIFIED = 0;
  LOSS_REASON_RING_FULL = 1;       // the simulation's ring was overwritten (PACED only)
  LOSS_REASON_CLIENT_TOO_SLOW = 2; // this client's buffer overflowed
  LOSS_REASON_RETENTION = 3;       // older than the server keeps
}

message Sample { uint32 channel_id = 1; double value = 2; }

message PinChange {
  uint32 pin_id = 1;
  bool high = 2;                 // the electrical level
  Source source = 3;             // FIRMWARE, or CLIENT for a driven input, or CHAIN
  uint64 command_seq = 4;        // for CLIENT
  uint32 source_id = 5;          // for CHAIN: the chain_id, as ChainNodeView.chain_id
}

message Call { string function = 1; string peripheral = 2; }

message Exchange {
  // `Event.sim_us` is the end of the exchange, so that events stay ordered.
  // Instantaneous buses give start_us == end_us.
  uint32 bus_id = 1;
  uint64 start_us = 2;
  uint64 end_us = 3;
  Direction direction = 4;
  uint32 address_value = 5;   // the number; a client formats it
  bytes payload = 6;          // at most LOOPER_BUS_PAYLOAD_CAPACITY (64) kept
  bytes response = 7;
  uint32 payload_length = 8;  // the real length; > payload.size() means cut
  uint32 response_length = 9;
  bool accepted = 10;
  Refusal refusal = 11;       // when not accepted
  Source source = 12;
  string source_name = 13;    // job or component name
  uint32 source_id = 14;
  // For frames a client put on the bus: the boundary the injection was
  // applied at, and the command. start_us - requested_at_us is the wait in
  // the bus queue and controller.
  uint64 requested_at_us = 15;
  uint64 command_seq = 16;
  oneof detail {
    CanDetail can = 20;
    UartDetail uart = 21;
    I2cDetail i2c = 22;
    SpiDetail spi = 23;
  }
}

enum Direction { DIRECTION_UNSPECIFIED = 0; DIRECTION_OUTBOUND = 1; DIRECTION_INBOUND = 2; }

enum Source {
  SOURCE_FIRMWARE = 0;
  SOURCE_CLIENT = 1;     // a one-off SendBusMessage
  SOURCE_JOB = 2;
  SOURCE_RULE = 3;
  SOURCE_COMPONENT = 4;
  SOURCE_CHAIN = 5;      // an action of a chain: a frame, a pin level, an interrupt
}

message CanDetail { bool extended = 1; bool remote = 2; uint32 dlc = 3; bool fd = 4; bool brs = 5; bool esi = 6; bool error_frame = 7; }

message UartDetail { string error_kind = 1; /* framing, parity, overrun, break, or empty */ }

message I2cDetail { bool is_read = 1; bool acknowledged = 2; optional uint32 register = 3; bool repeated_start = 4; }

message SpiDetail { uint32 chip_select = 1; }

// Every applied change, so that a recorded session can be played back from
// the log alone in HELD mode (review 7.3.7).
message CommandApplied {
  uint64 command_seq = 1;   // Event.sim_us is the application time
  string description = 2;   // "SendBusMessage can0 6FF#01 02", for people
  // The request in the control protocol (looper_control.proto), as the
  // simulation executed it, with absolute times. Replaying the log through
  // that protocol in HELD mode reproduces the session (T6).
  bytes encoded = 3;
}

message JobEvent {
  uint32 job_id = 1;
  // No SENT: every frame is an Exchange with source JOB and source_id.
  enum Kind { STARTED = 0; STOPPED = 1; FINISHED = 2; REFUSED = 3; LATE = 4; }
  Kind kind = 2;
  string text = 3;
}

message Fault { string source = 1; string text = 2; }

message RunEvent {
  enum Kind { REACHED = 0; HELD = 1; SLIPPED = 2; MODE_CHANGED = 3; }
  Kind kind = 1;
  uint64 amount_us = 2;   // SLIPPED: simulated time given up
  ClockMode mode = 3;
}

message ClearRequest {
  // Everything recorded is forgotten and the epoch is bumped; there is no
  // partial clear (a view hides kinds with a filter). event_seq continues.
  // The epoch the client believes is current; REFUSAL_WRONG_EPOCH if not, so
  // that two clients do not clear each other's fresh recording by accident.
  uint64 epoch = 1;
}

message PinDrive {
  uint32 pin_id = 1;
  // Toggle is done by the simulation, so two clients cannot both "toggle to high".
  // active: the level the pin's polarity calls active (true) or inactive
  // (false), chosen by the simulation, so that a client never turns a
  // polarity into a level itself.
  oneof level { bool high = 2; Empty toggle = 3; bool active = 5; }
  When when = 4;
}

message PinDriven {
  Ack ack = 1;
  bool high = 2;      // the level that was set
  bool active = 3;    // whether that level is the active one
}

message WatchStarted { WatchView watch = 1; Ack ack = 2; }

// One message, as the simulation puts it on a bus.
message BusMessage {
  uint32 bus_id = 1;
  uint32 address = 2;
  bytes payload = 3;
  bool extended = 4;
  optional uint32 dlc = 6;
  bool remote = 7;
  bool fd = 8;
  bool brs = 9;
  optional uint32 chunk_bytes = 10;   // UART
  optional uint32 byte_gap_us = 11;   // UART: simulated time between bytes
}

message BusMessageRequest { BusMessage message = 1; When when = 2; }

message BusMessageReply {
  // `ack.applied_at_us` is the injection. Whether and when the firmware took
  // the frame is the Exchange event with this `command_seq`; there is no
  // event_seq to give here, because the exchange is recorded when it is taken.
  Ack ack = 1;
  // One line for people: "6FF - 4 bytes - 11 bit".
  string summary = 2;
}

message SendJob {
  string name = 1;
  repeated SendStep steps = 2;
  Repeat repeat = 3;
  When start = 4;
  // Random bytes are a pure function of (random_seed, job_id, round, offset),
  // so a replay draws the same values.
  uint64 random_seed = 5;
}

message SendStep {
  // From the previous step of this job (from the job's start for the first).
  uint64 after_us = 1;
  BusMessage message = 2;
  repeated CounterField counters = 3;
  repeated ChecksumField checksums = 4;
  // Offsets of bytes the server fills with a random value per send.
  repeated uint32 random_bytes = 5;
}

message Repeat {
  oneof count { uint32 times = 1; bool until_stopped = 2; }
  // From the start of one round to the start of the next. Zero with burst > 1
  // is "all at one simulated moment". A round longer than the period is
  // REFUSED at the start (INVALID). A frame the bus queue refuses is an
  // Exchange (accepted false, QUEUE_FULL, source JOB), counts in `late`, and
  // the job goes on; a counter advances per round, not per accepted frame.
  uint64 period_us = 3;
  uint32 burst = 4;
}

message CounterField {
  uint32 byte_offset = 1;
  uint32 width_bytes = 2;
  bool big_endian = 3;
  uint64 start = 4;
  uint64 step = 5;
  bool wrap = 6;      // false: the job stops at the maximum
}

message ChecksumField {
  uint32 byte_offset = 1;
  string kind = 2;    // "xor8" "sum8" "crc8" "crc16_ccitt" "crc16_modbus" "crc32"
  uint32 from_byte = 3;   // inclusive
  uint32 to_byte = 4;     // inclusive; evaluated after the counters
  uint64 polynomial = 5;   // for "crc8" only
}

message JobChoice { uint32 job_id = 1; }

message JobView {
  uint32 job_id = 1;
  string name = 2;
  enum State { WAITING = 0; RUNNING = 1; FINISHED = 2; STOPPED = 3; REFUSED = 4; }
  State state = 3;
  uint64 next_due_us = 4;
  uint64 sent = 5;
  uint64 late = 6;     // frames the bus queue refused
  string last_error = 7;
  Ack ack = 8;
  // Echo of the schedule with absolute times, so that a replay can use it.
  uint64 started_at_us = 9;
}

message JobList { repeated JobView jobs = 1; }

// ---- Triggers ---------------------------------------------------------------
//
// The simulation watches for a condition where the facts are recorded and
// fires at the simulated instant it became true. Shared like jobs: every
// client sees every armed trigger, any client may disarm any, and a SINGLE
// trigger holds the simulation for everyone.

enum TriggerMode {
  TRIGGER_MODE_SINGLE = 0;   // fires once, holds post_us later -- for every client
  TRIGGER_MODE_NORMAL = 1;   // records every fire, at most once per post_us, never holds
  // No AUTO: that is a client's view rule on a NORMAL trigger.
}

enum EdgePolarity { EDGE_RISE = 0; EDGE_FALL = 1; EDGE_ANY = 2; }
enum Comparison { CMP_EQ = 0; CMP_NE = 1; CMP_LT = 2; CMP_LE = 3; CMP_GT = 4; CMP_GE = 5; }

message TriggerSpec {
  string label = 1;                // the expression as written, for every client
  TriggerCondition condition = 2;
  TriggerMode mode = 3;
  uint64 pre_us = 4;               // framing for every client; the log holds the data
  uint64 post_us = 5;
  uint64 capture_us = 6;           // framing; AUTO clients measure against it
  string armed_by = 7;             // the name a client gives itself, display only
  optional uint32 replaces_trigger_id = 8;   // one trigger per analyzer: rearm replaces
  When when = 15;
}

message TriggerCondition {
  oneof kind {
    EdgeCondition edge = 1;
    PatternCondition pattern = 2;       // fires on becoming true
    EdgeWhileCondition edge_while = 3;
    WidthCondition width = 4;
    QuietCondition quiet = 5;           // no edge for duration_us
    ValueCondition value = 6;           // when the value changes, at the reads of a pass
    AnalogCondition analog = 7;         // second cut: refused for now
    ExchangeCondition exchange = 8;     // second cut: refused for now
    SequenceCondition sequence = 9;     // second cut: refused for now
    // Shared with the chains of the signal graph; each is refused until the
    // step that builds it (ListChainBlocks names the ones served).
    BusReceivedCondition bus_received = 10;
    BusTimeoutCondition bus_timeout = 11;
    ClockCondition clock = 12;
    StartCondition start = 13;
    InterruptCondition interrupt = 14;
    ResetCondition reset = 15;
  }
}

message EdgeCondition { uint32 pin_id = 1; EdgePolarity polarity = 2; }
message PinLevelCondition { uint32 pin_id = 1; bool high = 2; }
message PatternCondition { repeated PinLevelCondition levels = 1; }
message EdgeWhileCondition { EdgeCondition edge = 1; repeated PinLevelCondition levels = 2; }
message WidthCondition {
  uint32 pin_id = 1;
  bool high = 2;
  Comparison op = 3;
  uint64 duration_us = 4;
  // GT and GE fire the moment the duration is exceeded (scheduled); the others at the closing edge.
}
message QuietCondition { uint32 pin_id = 1; uint64 duration_us = 2; }
message ValueCondition {
  uint32 channel_id = 1;
  Comparison op = 2;
  int64 value = 3;                // compared with the stored number after `& mask`
  uint64 mask = 4;                // 0: all bits
  bool on_change = 5;             // app.state:change
}
message AnalogCondition { uint32 channel_id = 1; double level = 2; double hysteresis = 3; EdgePolarity direction = 4; }
message ExchangeCondition { uint32 bus_id = 1; string query = 2; }
message SequenceCondition {
  TriggerCondition first = 1;
  TriggerCondition second = 2;
  uint64 within_us = 3;           // 0: no window
  bool second_absent = 4;         // fire when the window passes without `second`
}

message TriggerChoice { uint32 trigger_id = 1; string by_client = 2; }

message TriggerView {
  uint32 trigger_id = 1;
  TriggerSpec spec = 2;
  enum State { ARMED = 0; FIRED = 1; HELD = 2; DISARMED = 3; REFUSED = 4; }
  State state = 3;
  uint64 armed_at_us = 4;
  uint32 fires = 5;
  uint64 last_fired_at_us = 6;
  Ack ack = 7;
  string description = 8;          // "BUTTON falls" -- the server's words
  uint64 command_seq = 9;          // of the arming
  string disarmed_by = 10;
  uint64 hold_at_us = 11;          // SINGLE, fired: when the simulation holds
  string group_key = 12;           // "logic:<trigger_id>": its group in ObserveChains
}

message TriggerList { repeated TriggerView triggers = 1; }

message TriggerFired {
  uint32 trigger_id = 1;
  uint32 fire_n = 2;               // the how-manieth fire, from 1
  uint64 hold_at_us = 3;           // 0 for NORMAL
}

message TriggerDisarmed { uint32 trigger_id = 1; string by_client = 2; }

enum ExchangeUnit {
  EXCHANGE_UNIT_UNSPECIFIED = 0;
  EXCHANGE_UNIT_BYTE = 1;
  EXCHANGE_UNIT_WRITE = 2;   // one call of the firmware's write or read (UART today)
  EXCHANGE_UNIT_LINE = 3;
  EXCHANGE_UNIT_FRAME = 4;
  EXCHANGE_UNIT_TRANSACTION = 5;
}

message CurvePoint { uint64 sim_us = 1; double value = 2; }

message GapPoint { uint64 sim_us = 1; uint64 gap_us = 2; }   // the gap before that occurrence

message ViewPosition {
  uint64 epoch = 1;
  uint64 as_of_event_seq = 2;   // the view contains events before this number
}

service Inspector {
  rpc Describe(Empty) returns (Description);

  // ---- Running ----
  // Returns at once; a run in progress is seen in RunState.target_us and
  // ends with a RunEvent. (A client with a 60 s run_for must not hold a call.)
  rpc ControlRun(RunControl) returns (RunReply);
  rpc ObserveRun(Empty) returns (RunState);

  // ---- The ordered event stream ----
  rpc Subscribe(Subscription) returns (stream EventBatch);
  // One page of the same events without a stream, for tools and tests.
  rpc ReadEvents(ReadEventsRequest) returns (EventBatch);
  // Discard what was recorded, for every client. Starts a new epoch.
  rpc ClearRecordings(ClearRequest) returns (Ack);

  // ---- Reading ----
  rpc ObserveSimulation(Empty) returns (SimulationView);
  rpc ObserveChannels(Empty) returns (ChannelList);
  rpc ObserveWatches(Empty) returns (WatchList);
  rpc ObserveBuses(Empty) returns (BusList);
  rpc ObserveComponents(Empty) returns (ComponentList);
  // The catalogue of globals, read out of the build.
  rpc ListVariables(Empty) returns (VariableCatalogue);
  // The waveforms a signal generator offers.
  rpc ListWaveforms(Empty) returns (WaveformList);
  // Every recording on one stretch of time, as wide as the client asks for.
  rpc ArrangeTimeline(TimelineRequest) returns (TimelineView);
  // The bus the client names, read as a conversation.
  rpc ObserveLadder(LadderChoice) returns (LadderView);
  rpc ObserveTimings(Empty) returns (TimingReportView);
  rpc ObserveProfile(Empty) returns (ProfileView);
  // Following the paths costs the simulation something, so it is armed and
  // disarmed explicitly -- for the one simulation, and so for every client.
  rpc FollowCallPaths(Following) returns (Empty);
  rpc ObserveFlame(Empty) returns (FlameView);
  rpc ObserveMemory(Empty) returns (MemoryView);
  // The models the project offers the signal graph, read afresh, with why
  // any of them cannot be used.
  rpc ListModels(Empty) returns (ModelList);
  // How each model node of the applied graph is doing.
  rpc ObserveSignalGraph(Empty) returns (SignalGraphView);
  // Forget every measurement and begin one new window, for the timings, the
  // profile and the memory together.
  rpc ClearMeasurements(Empty) returns (Empty);

  // ---- Changing (every one returns an Ack, directly or inside) ----
  rpc DrivePin(PinDrive) returns (PinDriven);
  rpc ApplySignal(SignalRequest) returns (Ack);
  rpc ApplySignalGraph(SignalGraphRequest) returns (Ack);
  rpc ResetModelState(ModelNodeChoice) returns (Ack);
  // Change what one value node of the applied graph gives, without sending
  // the graph again. A model it supplies a parameter to is made again with
  // the new value and keeps its state, as ApplySignalGraph would keep it.
  // REFUSAL_UNKNOWN_TARGET: no value node of that key in the applied graph.
  // REFUSAL_INVALID: outside the limits of a parameter it supplies, or the
  // model failed with it; the graph runs on as it was.
  rpc SetGraphValue(GraphValueRequest) returns (Ack);
  rpc WatchVariable(VariableChoice) returns (WatchStarted);
  rpc RemoveWatch(WatchChoice) returns (Ack);        // watches: no `when`, always now
  rpc WriteVariable(VariableWrite) returns (Ack);
  rpc SendBusMessage(BusMessageRequest) returns (BusMessageReply);

  // ---- Jobs: things the simulation does later, by its own clock ----
  rpc StartSendJob(SendJob) returns (JobView);
  rpc StopSendJob(JobChoice) returns (JobView);
  rpc ObserveSendJobs(Empty) returns (JobList);

  // Triggers (CAPABILITY_TRIGGERS): watched by the simulation, shared by every client.
  rpc ArmTrigger(TriggerSpec) returns (TriggerView);
  rpc DisarmTrigger(TriggerChoice) returns (TriggerView);   // any client, any trigger
  rpc ObserveTriggers(Empty) returns (TriggerList);         // every trigger, armed or not

  // Chains in the signal graph: conditions, logic and actions joined by
  // event links, evaluated inside the simulation. ApplySignalGraph installs
  // them; these check a graph without applying it, report the chains, switch
  // one group, and list the blocks this server builds.
  rpc CheckSignalGraph(SignalGraphRequest) returns (GraphCheckView);
  rpc ObserveChains(Empty) returns (ChainList);
  rpc SwitchChainGroup(ChainGroupSwitch) returns (Ack);
  rpc ListChainBlocks(Empty) returns (ChainBlockCatalogue);
  // One group's chain as a pytest against looper-py, written by the server
  // so that it matches the API; the window only saves it. looper Pro
  // (PRO_FEATURE_SCENARIOS): PERMISSION_DENIED without the licence.
  rpc ExportChainAsPytest(PytestExportRequest) returns (PytestExport);
  // A DBC file's CAN messages and signals, so that a bus block can take its
  // identifier, length and fields from one message. The server only reads the
  // file. Free; fields filled from it are looper Pro as every field is.
  rpc ReadDbc(DbcRequest) returns (DbcView);

  // ---- Source code: the files the build was made of ----
  // Every file worth showing, with whether it changed since the build.
  rpc ListSources(Empty) returns (SourceTreeView);
  // The text of one file; by default the copy the build kept.
  rpc ReadSource(SourceRequest) returns (SourceText);
  // What the names of one file stand for, read with the build's flags.
  // Slow the first time per text of a file, at once afterwards.
  rpc ObserveSemantics(SourceRequest) returns (SemanticsView);
  // How often each line of one file ran; a counting build only (else
  // `counting` is false and the note says how to start one). Exact, and
  // fetched from the simulation at most once a second.
  rpc ObserveLineCounts(SourceRequest) returns (LineCountView);
  // How much of every counted file ran, and the functions nobody called.
  rpc ObserveCoverage(Empty) returns (CoverageView);
  // Count from now on; the Ack carries the simulated time counting restarts at.
  rpc ResetLineCounts(Empty) returns (Ack);
  // The lines and functions that ran most, and the functions that cost the
  // host most; a counting build only.
  rpc ObserveHotspots(Empty) returns (HotspotsView);

  // ---- Debugger: stop the firmware at lines, simulated time standing still ----
  // While the firmware stands, every other call that asks the simulation is
  // refused with FAILED_PRECONDITION and RunState.hold_reason says why.
  rpc ObserveDebugger(Empty) returns (DebugView);
  rpc ControlDebugger(DebugControl) returns (DebugView);

  // ---- Restart ----
  // Start the simulation again from 0 s, building it first when asked. The
  // answer comes before the connection drops; a build runs while the old
  // simulation does, and one that fails leaves it running.
  rpc RestartSimulation(RestartRequest) returns (RestartView);
  rpc ObserveRestart(Empty) returns (RestartView);

  // ---- Reset and lives (CAPABILITY_RESET) ----
  // A reset is not a restart: the firmware begins a new life, simulated time
  // and the recording go on, clients stay connected, and watches, triggers,
  // signals and held inputs are set again. A held simulation resets at its
  // next run.
  rpc ResetFirmware(ResetRequest) returns (Ack);
  // Every life of this run, the number of resets, and a reset loop.
  rpc ObserveLives(Empty) returns (LifeList);
  // What a life that has ended left behind: its heap book and its profile.
  rpc ReadLifeDump(LifeChoice) returns (LifeDumpView);
  // The retained memory, which survives a reset; and writing it by hand.
  rpc ObserveRetained(Empty) returns (RetainedView);
  rpc WriteRetained(RetainedWrite) returns (Ack);

  // ---- Flash (CAPABILITY_FLASH) ----
  // Bits only go from 1 to 0 without an erase; erasing is by sector. A raw
  // write lays bytes down past that rule (a broken header on purpose), but
  // never into a read-only partition. Save and load move the whole flash.
  rpc ObserveFlash(FlashRequest) returns (FlashView);
  rpc WriteFlash(FlashWrite) returns (Ack);
  rpc EraseFlash(FlashErase) returns (Ack);
  rpc SaveFlash(Empty) returns (FlashContent);
  rpc LoadFlash(FlashContent) returns (Ack);

  // ---- Bootloader (CAPABILITY_BOOT; Pro) ----
  // Code cannot run from the simulated flash: a boot.jump ends the image's
  // process, and the server starts the built image the header at the target
  // names. Without the licence these are refused with PERMISSION_DENIED and
  // a sentence; FlashView then carries no header state.
  // The images and their variants, built or not.
  rpc ObserveImages(Empty) returns (ImageList);
  // Arm a power cut while the firmware programs or erases, or cut it at a time.
  rpc CutPower(PowerCutRequest) returns (Ack);
  // The lives between two resets, each the images it went through.
  rpc ObserveBootChain(Empty) returns (BootChainView);
  // The one-time-programmable memory; burning sets bits, nothing clears them.
  rpc ObserveOtp(Empty) returns (OtpView);
  rpc BurnOtp(OtpBurn) returns (Ack);

  // ---- Interrupts (CAPABILITY_INTERRUPTS; free) ----
  // An ISR runs at the firmware's interruption points: an adapter call, a
  // wait, the end of a pass. Times are simulated; computing costs none.
  // The sources from contract.toml, with what they did in this life; before
  // the firmware called its first interrupt role every count is 0 and
  // `note` says why.
  rpc ObserveInterrupts(Empty) returns (InterruptReport);
  // Make a source due, now or at a time, as its pin or timer would. A source
  // that is not `is_raisable`, or one before the table is installed, is
  // refused with REFUSAL_NOT_ACCEPTED and a sentence.
  rpc RaiseInterrupt(InterruptRaise) returns (Ack);
  // Pro (RUN_FINDINGS): what the run's interrupt and DMA events amount to,
  // judged by the server against looper.toml's limits; without the licence
  // PERMISSION_DENIED with the sentence. A request naming the revision the
  // client has is answered with `unchanged` and nothing else.
  rpc ObserveRunFindings(RunFindingFilter) returns (RunFindingList);
  // Pro (RUN_FINDINGS): the race mode raises one source at each interruption
  // point in turn, deterministically, to provoke what an unlucky interrupt
  // breaks. It finds nothing itself: checks, assertions and findings do.
  // Without the licence PERMISSION_DENIED with the sentence.
  rpc SetRaceMode(RaceRequest) returns (RaceView);
  rpc ObserveRaceMode(Empty) returns (RaceView);
  // ---- DMA (CAPABILITY_DMA; free) ----
  // The channels from contract.toml, where they stand and what they moved.
  // The guard over a running receive buffer is on only with the licence
  // (RUN_FINDINGS) and CAPABILITY_DMA_GUARD; without it `guard` is LOCKED.
  rpc ObserveDma(Empty) returns (DmaReport);

  // ---- Architecture (CAPABILITY_ARCHITECTURE) ----
  // Read from the project's code index, which the server builds in the
  // background; every answer says how far it got. A request naming the
  // revision the client has is answered with `unchanged` and nothing else.
  rpc ObserveFunctionMetrics(ArchitectureRequest) returns (FunctionMetricsView);
  rpc ObserveFileMetrics(ArchitectureRequest) returns (FileMetricsView);
  // The nodes and dependencies of a scope (the project's layers, a layer's
  // modules, a module's functions) or of a focus on one module.
  rpc ObserveArchitecture(ArchitectureFocus) returns (ArchitectureGraph);
  // The findings about a node, or all of them.
  rpc ObserveFindings(FindingFilter) returns (FindingList);
  // The places in the code that make one drawn dependency.
  rpc ObserveDependencyPlaces(PlacesRequest) returns (PlaceList);
  // The rules as they stand: architecture.toml's, or proposed from the folders.
  rpc ObserveArchitectureRules(Empty) returns (ArchitectureRulesView);
  // One small change to the rules, written to architecture.toml at once.
  // Refused (FAILED_PRECONDITION) when the file changed since base_revision;
  // the answer carries the change that undoes it.
  rpc ChangeArchitectureRules(RuleChangeRequest) returns (RuleChangeReply);
  // Take findings into architecture-baseline.toml, so they are known rather than new.
  rpc AcceptFindings(AcceptFindingsRequest) returns (Ack);
  // The firmware's state machines: a switch over a variable the code sets.
  rpc ObserveStateMachines(Empty) returns (StateMachineList);
  rpc ObserveStateMachine(StateMachineChoice) returns (FirmwareStateMachine);
  // Follow a machine in the run (a simulation only): a watch on its
  // variable, read back as the states it took -- once per loop pass.
  rpc FollowStateMachine(MachineFollowRequest) returns (Ack);
  // The calls one function makes, in the order the code writes them, a few
  // calls deep, as a sequence: free, and without a simulation (plan 4.4).
  rpc ObserveCallTree(CallTreeRequest) returns (CallTree);
  // Record from now on the calls that cross between these modules, or stop
  // (Pro, plan 4.3). Needs a profile build; refused without a running one.
  rpc FollowSequence(SequenceFollowRequest) returns (Ack);
  // The recorded calls of a stretch of the run, pass by pass (Pro).
  rpc ObserveSequence(SequenceRequest) returns (RecordedSequence);

  // A board at a debug probe (SERVER_MODE_HARDWARE, CAPABILITY_HARDWARE, Pro):
  // write the firmware into its flash and verify it, and see what its core
  // does. Halt and resume are ControlRun{hold} and ControlRun{max_speed} or
  // {pace_ratio: 1.0}; a reset is ResetFirmware with `when` now. A client
  // resumes with pace_ratio 1.0 only. FlashFirmware returns at once, as
  // RestartSimulation does: it is accepted or refused, and the writing is
  // followed in TargetView.flash. On a board, RestartSimulation reconnects:
  // the probe is opened anew, the board attached, the licence read again.
  rpc FlashFirmware(FlashFirmwareRequest) returns (FlashFirmwareView);
  rpc ObserveTarget(Empty) returns (TargetView);
}

message FlashFirmwareRequest {
  string elf_path = 1;   // empty: the ELF `[target] elf` names
  bool verify = 2;       // read the flash back and compare
}

message FlashFirmwareView {
  uint64 bytes = 1;      // bytes the flash will be written with
  string took_text = 2;  // empty when the call returns; the time is in FlashProgress.took_text
  string text = 3;       // e.g. "Flashing blinky.elf (904 bytes)."
}

// A flash being written, or the last one written, in the server's words.
message FlashProgress {
  bool running = 1;
  string phase_text = 2;   // e.g. "erasing", "programming", "verifying"
  float fraction = 3;      // 0 to 1 while running
  string result_text = 4;  // when done: "Flashed blinky.elf (904 bytes), verified it and started it."
  bool failed = 5;         // result_text then says why
  string took_text = 6;    // e.g. "1.4 s"
}

enum CoreState {
  CORE_STATE_UNSPECIFIED = 0;
  CORE_STATE_RUNNING = 1;
  CORE_STATE_HALTED = 2;
  CORE_STATE_RESET = 3;
  CORE_STATE_LOCKED_UP = 4;
  // No board is attached: no probe, the probe in use, a chip other than
  // [target] names. TargetView.problem_text says which; the server tries
  // again about once a second.
  CORE_STATE_DETACHED = 5;
}

message TargetView {
  string chip = 1;              // e.g. "STM32L152RETx"
  string probe_text = 2;        // e.g. "ST-Link V2-1 (0483:3752, 066BFF54…)"
  CoreState core_state = 3;
  string pc_text = 4;           // while halted, e.g. "0x080000c4 main.c:57"
  string halt_reason_text = 5;  // e.g. "halted by request at main.c:57"
  string time_base_text = 6;    // e.g. "times are the DWT cycle counter at 2.097 MHz"
  string problem_text = 7;      // why no board is attached; empty while one is
  CodePlace halted_at = 8;      // while halted at a known line: the path as ListSources names it, and the line
  string elf_path = 9;          // the ELF FlashFirmware takes when it names none
  FlashProgress flash = 10;     // the flash being written, or the last one; unset before the first
}

// A reset from outside: PIN (the reset pin), POWER_ON or BROWN_OUT (the power goes and comes back; without [retained] battery the retained memory is lost). Absent: PIN. SOFTWARE and WATCHDOG are refused.
message ResetRequest {
  ResetCause cause = 1;
  When when = 2;
}

message LifeView {
  uint32 life = 1;
  string image = 2;
  string partition = 3;
  EnteredBy entered_by = 4;
  uint64 started_at_us = 5;
  uint64 ended_at_us = 6;          // 0: it runs now
  LifeEndReason ended_by = 7;
  ResetCause cause = 8;            // why it ended: the reset's cause, power-on for a power cut; unset for a jump (ended_by says it)
  string text = 9;                 // "life 3 · 12.300 s – 14.020 s · watchdog"
  bool has_dump = 10;              // ReadLifeDump answers for it
}

message LifeList {
  repeated LifeView lives = 1;     // oldest first, the life that runs now last
  uint32 resets = 2;
  string last_cause_text = 3;      // "watchdog"; empty before the first reset
  string running_text = 4;         // "life 4"
  string loop_finding = 5;         // empty, or "Reset loop: 10 resets within 1 s (watchdog each time)."
  uint32 lives_forgotten = 6;      // lives whose dumps are no longer kept
}

message LifeChoice { uint32 life = 1; }

message RetainedView {
  uint32 size = 1;                 // 0: the simulation has none
  bytes content = 2;
  bool battery = 3;
  string note = 4;                 // "survives resets, lost when the power goes (power-on, brown-out)", or how to have one
}

message RetainedWrite { uint32 offset = 1; bytes data = 2; When when = 3; }

// A stretch of the flash to read; length 0 reads none, only the layout.
message FlashRequest { uint64 offset = 1; uint32 length = 2; }

message PartitionView {
  string name = 1;
  uint64 offset = 2;
  uint64 size = 3;
  bool read_only = 4;
  HeaderState header = 5;          // Pro; without a licence UNSPECIFIED (not read)
  string header_text = 6;
}

enum HeaderState {
  HEADER_STATE_UNSPECIFIED = 0;
  HEADER_STATE_EMPTY = 1;
  HEADER_STATE_VALID = 2;
  HEADER_STATE_BROKEN = 3;
  HEADER_STATE_UNKNOWN_IMAGE = 4;
  HEADER_STATE_NO_HEADER = 5;      // not erased, no magic: other data, or a magic cut in its first word
}

message FlashView {
  uint64 base = 1;                 // where the firmware sees it
  uint64 size = 2;                 // 0: the simulation has no flash
  uint32 sector_size = 3;
  uint32 word_size = 4;
  repeated PartitionView partitions = 5;
  uint64 offset = 6;               // the stretch asked for
  bytes content = 7;
  bool persist = 8;                // kept in build/flash.bin between runs
  string note = 9;                 // "not kept between runs", or how to have a flash
  repeated uint32 written_sectors = 10;   // sectors that are not erased, for the map
  uint32 erased_value = 11;
  string persist_text = 12;        // "kept in build/flash.bin" / "not kept between runs"
}

message FlashWrite {
  oneof target { uint64 offset = 1; PartitionOffset partition = 2; }
  oneof content { bytes data = 3; string image = 4; string image_file = 5; }   // 4, 5: Pro
  bool raw = 6;                    // past the rules: bytes as they are
  When when = 7;
}

message PartitionOffset { string name = 1; uint64 offset = 2; }

message FlashErase {
  oneof what { Empty whole = 1; string partition = 2; uint32 sector = 3; }
  When when = 4;
}

message FlashContent { bytes content = 1; }

// One image of [[images]], in one of its variants.
message ImageView {
  string name = 1;
  string variant = 2;              // empty for an image without variants
  string identity_hex = 3;         // empty until built
  string version_text = 4;         // "0x0201", from the define VERSION
  uint64 payload_size = 5;         // the payload a header carries: the image's size on the target
  bool built = 6;
  string text = 7;                 // "app@2.1 · built · 96 KiB · 7f3a…e1"
  string ref = 8;                  // "app@2.1", as FlashWrite.image names it
  string origin_text = 9;          // "stand-in" or "target build (build/arm/app.bin)"
}

message ImageList {
  repeated ImageView images = 1;
  string note = 2;                 // why there are none, or that one image is no chain
}

message PowerCutRequest {
  oneof trigger {
    uint64 after_bytes = 1;        // of the firmware's flash writes and erases from now
    When at = 2;                   // at a time; now when When is empty
  }
  FlashActivity during = 3;
  uint64 off_for_us = 4;           // how long the board is without power
  uint64 seed = 5;                 // which bits of the word in flight changed
  bool disarm = 6;                 // take an armed cut back; the rest is ignored
}

enum FlashActivity {
  FLASH_ACTIVITY_ANY = 0;
  FLASH_ACTIVITY_WRITE = 1;
  FLASH_ACTIVITY_ERASE = 2;
}

// One life of a boot chain: one image, from the partition it was started from.
message BootStep {
  uint32 life = 1;
  string image = 2;                // "stage1@1.0"
  string partition = 3;
  EnteredBy entered_by = 4;
  uint64 at_us = 5;
  LifeEndReason ended_by = 6;      // UNSPECIFIED while it runs
  string text = 7;                 // "stage1_a 1.0"
}

// The lives between two resets: the boot chain one start went through.
message BootChain {
  repeated BootStep steps = 1;
  ResetCause started_by = 2;       // what reset the board: power-on for the first
  string text = 3;                 // "stage0 → stage1_a 1.0 → app_b 2.1"
  string went = 4;                 // the partitions, as expect().boot_chain().went() takes them: "stage0 stage1_a app_b"
  string started_by_text = 5;      // started_by as a word: "power-on", "watchdog", "pin"
}

message BootChainView {
  repeated BootChain chains = 1;   // oldest first
  string note = 2;
}

message OtpView {
  uint32 size = 1;                 // 0: the simulation has none
  bytes content = 2;
  string note = 3;                 // "bits only go from 0 to 1, for every run while the flash is kept"
}

// Burn the bits that are 1 in data, from offset.
message OtpBurn { uint32 offset = 1; bytes data = 2; When when = 3; }

message LifeDumpView {
  LifeView life = 1;
  MemoryView memory = 2;
  ProfileView profile = 3;
  string note = 4;                 // why something is missing ("killed in a hang: no dump")
}

message PinView {
  uint32 pin_id = 1;
  string name = 2;
  // "input" or "output".
  string direction = 3;
  // "low" or "high".
  string level = 4;
  bool is_active = 5;
  bool is_drivable = 6;
  // Which level the firmware treats as active, as a person reads it:
  // "active high" or "active low".
  string polarity = 7;
  // Why a client cannot drive the pin, in words a person is shown, for
  // example "the firmware drives this output". Empty when it can.
  string drive_text = 8;
  // A chain set the pin last: who and when, as a person reads it --
  // "chain \"Boost test\" at 2.500000 s". Empty when a chain did not.
  string last_writer_text = 9;
  uint64 last_written_us = 10;
  // The node_key of the action block that set it; empty when a chain did
  // not, or when no block of that chain sets this pin.
  string last_writer_node_key = 11;
}

message SimulationView {
  uint64 sim_us = 1;
  reserved 2;
  reserved "time_mode";
  repeated PinView pins = 3;
}

message SignalView {
  string waveform = 1;
  double amplitude = 2;
  double offset = 3;
  double frequency_hz = 4;
  double phase_degrees = 5;
}

message ChannelView {
  uint32 channel_id = 1;
  string name = 2;
  string unit = 3;
  string direction = 4;
  double value = 5;
  bool is_drivable = 6;
  SignalView signal = 7;
  bool is_silent = 8;
  // Value and unit as one string, or "no data" for a silent channel.
  string display_value = 9;
  // Whether the signal graph drives this input, so that its own signal
  // does not apply.
  bool is_driven_by_graph = 10;
  // Whether a signal a client applies takes effect now: an input the
  // signal graph does not drive. ApplySignal is still accepted when it
  // does not, and takes effect once the graph lets go of the input.
  bool is_settable = 11;
  // Why not, in words a person is shown: "the firmware writes this
  // output", "the signal graph drives this input". Empty when settable.
  string settable_text = 12;
  // The value as display_value writes it, without the unit; empty for a
  // silent channel.
  string value_text = 13;
  // Who held this input at a level last, when a chain did:
  // 'chain "Boost test" at 2.500000 s'; empty otherwise.
  string last_writer_text = 14;
  uint64 last_written_us = 15;
  // The node_key of the Switch signal block that held it; empty otherwise.
  string last_writer_node_key = 16;
}

message ChannelList {
  repeated ChannelView channels = 1;
}

message SignalRequest {
  uint32 channel_id = 1;
  SignalView signal = 2;
  When when = 15;
}

message WaveformView {
  // What a SignalView carries, for example "sine".
  string name = 1;
  // What a person is shown, for example "Sine".
  string display_name = 2;
  // Whether amplitude, frequency and phase mean anything for it.
  bool is_alternating = 3;
  // Whether frequency and phase mean anything for it; noise swings
  // without a period.
  bool is_periodic = 4;
}

// One output of a node, read by another.
message SignalInputRequest {
  // The key of the node read.
  string node = 1;
  // Which of its outputs, counted from zero; only a model has more than one.
  uint32 output = 2;
}

// One node of a signal graph, as a client drew it.
message SignalNodeRequest {
  // What the client calls the node; unique within the graph.
  string key = 1;
  // "generator", "channel", "pin", "watch", "add", "subtract",
  // "multiply", "divide", "model" or "value".
  string kind = 2;
  // What a generator produces.
  SignalView signal = 3;
  // The channel, pin or watch channel a source reads.
  uint32 source = 4;
  // What the node reads, in order: the two inputs of an operation, the
  // inputs of a model, the signals of a block's message fields. An entry
  // with an empty `node` keeps the place of an input not linked yet, so
  // that the inputs after it keep theirs; the block then has the problem
  // "Signal input not linked".
  repeated SignalInputRequest inputs = 5;
  // The model a model node stands for, as ListModels names it.
  string model = 6;
  // The values its parameters are given, by name; a parameter left out
  // keeps its default.
  map<string, double> parameters = 7;
  // Step this model node in Python even though it could be compiled, so
  // that a breakpoint in its step is reached. Ignored for a linear model
  // and for every other kind. The model then runs in the model worker.
  bool interpreted = 8;
  // What a value node gives until SetGraphValue changes it. A value node
  // (kind "value") has one output and no inputs; fed into a signal input
  // it is a constant, fed into a parameter it is the parameter's value.
  double value = 9;
  // Parameters of a model node that another node supplies, by parameter
  // name: the key of that node. Only a value node or a constant generator
  // may supply a parameter -- a parameter is a constant the model is made
  // with, so it follows a value someone sets, never a signal. A parameter
  // supplied here overrides the same name in `parameters`.
  map<string, string> parameter_sources = 10;
  // An event block of a chain: its kind is one of ChainBlockKind.kind, its
  // settings are here, and its signal inputs (a threshold's signal, the
  // signals of message fields) are `inputs`.
  ChainBlockRequest block = 11;
  // The ChainGroupRequest it belongs to; empty: none.
  string group_key = 12;
}

message ModelParameterView {
  string name = 1;
  double default_value = 2;
  // What it is measured in; empty for nothing.
  string unit = 3;
  // The lowest and highest value the model accepts, where the model
  // declares them (StateModel.limits, LinearModel.limits). ApplySignalGraph
  // refuses a value outside them with REFUSAL_INVALID. Unset where the
  // model says nothing.
  optional double lowest = 4;
  optional double highest = 5;
}

// One model a project offers, or one file that offers nothing usable.
message ModelView {
  string name = 1;
  // What it is, in the model's own words.
  string description = 2;
  repeated string inputs = 3;
  repeated string outputs = 4;
  repeated ModelParameterView parameters = 5;
  // Simulated time between two of its steps.
  uint64 step_us = 6;
  // The file it is written in.
  string source = 7;
  // Why it cannot be used; empty when it can.
  string problem = 8;
  // "linear" or "state": a system from control, or a StateModel class.
  string kind = 9;
  // "linear", "compiled" or "interpreted": how the simulation steps it.
  string execution = 10;
  // What a node shows for it: "LTI", "C" or "Py".
  string execution_label = 11;
  // Why it runs in Python, as file:line and reason; empty when it does not,
  // and when it does because the class asked for it.
  string execution_reason = 12;
  // What its state is called, in order. Empty for a linear model.
  repeated string state_names = 13;
  // "project" or "built_in": whether the project's models directory holds
  // it, or looper-core ships it. A project model of the same name as a
  // shipped one stands in for it, so a name is listed once.
  string origin = 14;
  // Where it comes from, as a menu heads it: "Project" or "looper-core".
  string origin_label = 15;
  // The origin_label of a model of the same name this one hides, empty
  // when it hides none: "looper-core" for a project's copy of a shipped
  // model, so that the reader sees the copy is the one in use.
  string stands_in_for = 16;
}

message ModelNodeChoice {
  // The key the client gave the node in SignalGraphRequest.
  string node = 1;
  When when = 15;
}

message ModelStateView {
  string name = 1;
  double value = 2;
  // The value as the panel shows it.
  string value_text = 3;
}

message ModelNodeView {
  string node = 1;
  // As in ModelView, but for this node.
  string execution = 2;
  string execution_label = 3;
  string execution_reason = 4;
  // Why it stopped: a step that produced NaN or infinity. Empty while it
  // runs.
  string fault = 5;
  // Empty for a linear model, and for a model that names no state.
  repeated ModelStateView state = 6;
  // The values the installed node runs with, by parameter name, defaults
  // and supplied ones included: what the editor shows beside a parameter
  // fed by a value node.
  map<string, double> parameters = 7;
}

message SignalGraphView {
  // Only the model nodes, in the order of the graph.
  repeated ModelNodeView models = 1;
  // The probes of the applied graph, each with the trace channel its
  // samples arrive on. A probe keeps its channel while its name stays.
  repeated ProbeView probes = 2;
  // The value nodes of the applied graph, each with what it gives now.
  repeated GraphValueView values = 3;
}

// Change what one value node of the applied graph gives.
message GraphValueRequest {
  // The value node, by its key in the applied graph.
  string node = 1;
  double value = 2;
  When when = 15;
}

// One value node of the applied graph, as it is now.
message GraphValueView {
  // The key the client gave the node.
  string node = 1;
  // What it gives now: the last SetGraphValue, else what the graph said.
  double value = 2;
  // What it is measured in and what it may be, taken from the parameters
  // it supplies: the unit of the first, the narrowest common limits.
  // Empty and unset when it supplies none or they say nothing.
  string unit = 3;
  optional double lowest = 4;
  optional double highest = 5;
  // What it feeds, as a person reads it: "DcMotor.inertia, SPEED_SETPOINT";
  // empty when nothing.
  string feeds_text = 6;
  // Who set it last, when a chain did: 'chain "Boost test" at 2.500000 s';
  // empty otherwise. `value` is what the simulation gives now.
  string last_writer_text = 7;
  uint64 last_written_us = 8;
  // The node_key of the Switch signal block that set it; empty otherwise.
  string last_writer_node_key = 9;
}

// A signal inside the applied graph that is recorded like a channel.
message ProbeView {
  string name = 1;
  // The trace channel its samples arrive on, as EVENT_KIND_SAMPLE.
  uint32 channel_id = 2;
  // The node it records, by the key the client gave it, and which output.
  string node = 3;
  uint32 output = 4;
}

message ModelList {
  repeated ModelView models = 1;
  // Why there are no models at all, when the simulation knows of no
  // directory to find them in.
  string unavailable_reason = 2;
}

// Which node drives which analog input.
message SignalTargetRequest {
  uint32 channel_id = 1;
  string node = 2;
  // Which of the node's outputs drives the input; only a model has more
  // than one.
  uint32 output = 3;
}

// A signal inside the graph to record: only a target reaches the firmware,
// what feeds it exists nowhere else. Recorded whenever the graph is
// evaluated, which is when the firmware reads an input the graph drives;
// a graph that drives no input records nothing.
message SignalProbeRequest {
  // What the client calls it; unique in the graph. The trace channel
  // follows the name, see SignalGraphView.probes.
  string name = 1;
  string node = 2;
  // Which of the node's outputs; only a model has more than one.
  uint32 output = 3;
}

message SignalGraphRequest {
  repeated SignalNodeRequest nodes = 1;
  repeated SignalTargetRequest targets = 2;
  repeated SignalProbeRequest probes = 3;
  // The links between event blocks, and the chains they are grouped into.
  repeated EventLinkRequest event_links = 4;
  repeated ChainGroupRequest groups = 5;
  When when = 15;
}

message WaveformList {
  repeated WaveformView waveforms = 1;
}

message VariableView {
  // Identifies the variable in this server's catalogue. Paths are not
  // unique: two translation units may each declare a static of one name.
  uint32 variable_id = 1;
  string path = 2;
  string name = 3;
  string root = 4;
  // The steps of the path, the way a tree opens them: the root, then
  // every member and every subscript.
  repeated string segments = 5;
  string encoding = 6;
  uint32 byte_width = 7;
  uint64 link_time_address = 8;
  uint64 runtime_address = 9;
  bool is_writable = 10;
  uint32 bit_offset = 11;
  uint32 bit_width = 12;
  // "firmware", "simulation" or "toolchain".
  string origin = 13;
  bool is_firmware = 14;
  // Source file the variable was declared in, empty when not known.
  string declared_in = 15;
  // Encoding and width, for example "uint 4 B" or "uint 3 bits".
  string display_type = 16;
  // Link time address in hexadecimal.
  string display_address = 17;
  // Whether the type is an enumeration, and the names of its values in
  // declaration order (DW_TAG_enumerator). A client may name single values
  // itself; the build's names are the default.
  bool is_enum = 18;
  repeated Enumerator enumerators = 19;
}

// One value an enumeration names.
message Enumerator { int64 value = 1; string name = 2; }

message VariableCatalogue {
  repeated VariableView variables = 1;
  // Why there is no catalogue, empty when there is one.
  string unavailable_reason = 2;
}

// How a stored number maps onto the quantity it stands for:
// quantity = stored * scale + offset. A scale of zero, which proto3 sends
// for a message nobody filled in, means the stored number itself.
message Scaling {
  double scale = 1;
  double offset = 2;
}

message VariableChoice {
  uint32 variable_id = 1;
  // What the stored number stands for, as the client's project says: an
  // int16 of hundredths of an ampere is scale 0.01. Unset for the number
  // itself. A bool takes none.
  Scaling scaling = 2;
}

message WatchView {
  uint32 channel_id = 1;
  string path = 2;
  string name = 3;
  string encoding = 4;
  uint32 byte_width = 5;
  uint64 runtime_address = 6;
  bool is_writable = 7;
  double value = 8;
  uint32 bit_offset = 9;
  uint32 bit_width = 10;
  // The value written the way its own type reads; a scaled integer to as
  // many decimals as its step needs.
  string display_value = 11;
  // What the variable can hold, for example "uint8, 0 to 255".
  string range_text = 12;
  // Once the unit of the value. A unit is not the simulation's to know:
  // the debug information only says how a value is stored, and what it
  // means belongs to the client's own project.
  reserved 13;
  reserved "unit";
  // The lowest and highest quantity the variable can stand for: what its
  // type holds, scaled. For floating point, the finite extremes of its width.
  double lowest = 14;
  double highest = 15;
  // The smallest step between two quantities it can hold: the scale for an
  // integer, so 1 when unscaled; 0 for floating point.
  double resolution = 16;
  // The number as it is stored, before scaling. value is the quantity.
  double raw_value = 17;
  Scaling scaling = 18;
  // How often the simulation reads the value, in simulated time, and the
  // sentence a client shows for it: a change that returns within one read
  // is not seen.
  uint64 read_period_us = 19;
  string read_period_text = 20;
  // The names of its values, for an enumeration.
  repeated Enumerator enumerators = 21;
  // The enumerator that names the value as it is stored, for an
  // enumeration: the first one declared with that value. Empty when the
  // value has no name, and for every other type. display_value stays the
  // number, so that scopes and the Variables page read as before. A flag
  // and an enumeration are watched without a scaling, whatever the client
  // asked; range_text then says "enum, scaling ignored".
  string value_name = 22;
}

message WatchList {
  repeated WatchView watches = 1;
}

message WatchChoice {
  uint32 channel_id = 1;
}

message VariableWrite {
  uint32 channel_id = 1;
  // The quantity to store, as WatchView.value shows it. looper-core turns it
  // into the stored number by the watch's scaling and cuts an integer
  // towards zero, a quotient within 1e-9 of a whole number taken as that
  // number.
  double value = 2;
  When when = 15;
}

message BusList {
  repeated BusView buses = 1;
}

message ComponentView {
  uint32 bus_id = 1;
  string address = 2;
  string name = 3;
  string model = 4;
  repeated uint32 properties = 5;
}

message ComponentList {
  repeated ComponentView components = 1;
}

message PartyView {
  string address = 1;
  string name = 2;
  bool is_silent = 3;
}

message StepView {
  uint64 sim_us = 1;
  string gap = 2;
  uint32 column = 3;
  bool is_outbound = 4;
  string payload = 5;
  string response = 6;
  bool was_taken = 7;
}

message LadderView {
  string bus_name = 1;
  repeated PartyView parties = 2;
  repeated StepView steps = 3;
  string note = 4;
  ViewPosition position = 5;
}

message LadderChoice {
  // The bus to read; absent for an empty ladder.
  optional uint32 bus_id = 1;
}

message WindowView {
  uint64 start_us = 1;
  uint64 end_us = 2;
}

message MarkView {
  uint64 sim_us = 1;
  string label = 2;
  string detail = 3;
  uint64 duration_us = 4;
  bool is_doubtful = 5;
  bool is_high = 6;
}

message LaneView {
  string key = 1;
  string label = 2;
  // "digital", "bus" or "call", which decides how the row is drawn.
  string kind = 3;
  repeated MarkView marks = 4;
  uint32 count = 5;
  // The gap before each occurrence, against when it ended.
  repeated GapPoint gaps = 6;
  uint64 usual_gap_us = 7;
  uint64 worst_gap_us = 8;
  string summary = 9;
}

message CurveView {
  string key = 1;
  string label = 2;
  uint32 channel_id = 3;
  repeated CurvePoint points = 4;
  double lowest = 5;
  double highest = 6;
}

message TimelineView {
  WindowView window = 1;
  // Everything there is to show; absent when nothing was recorded.
  WindowView recorded = 2;
  repeated CurveView curves = 3;
  repeated LaneView lanes = 4;
  bool is_empty = 5;
  ViewPosition position = 6;
}

message Following {
  bool wanted = 1;
}

message TimelineRequest {
  // How much of the past to show, ending at the newest thing recorded.
  // Zero for the server's default; held to what the server keeps.
  uint64 window_us = 1;
}

message CallTimingView {
  string function = 1;
  uint64 calls = 2;
  uint64 answered_calls = 3;
  uint64 total_host_ns = 4;
  string mean = 5;
  string longest = 6;
  bool is_never_answered = 7;
  // Calls per band of duration, band n holding 2^n to 2^(n+1) ns.
  repeated uint64 bands = 8;
  string shape = 9;
  // "adapter", "firmware", "device model", ...
  string origin = 10;
}

message TimingReportView {
  // One per function, heaviest first.
  repeated CallTimingView entries = 1;
  // Host time of the heaviest entry, which scales a chart.
  uint64 heaviest_host_ns = 2;
}

message ProfileEntryView {
  string name = 1;
  string origin = 2;
  string directory = 3;
  string file_name = 4;
  uint64 calls = 5;
  uint64 self_nanoseconds = 6;
  uint64 total_nanoseconds = 7;
  string self_text = 8;
  string total_text = 9;
  string mean_text = 10;
  string longest_text = 11;
  // Where it is written, for "Show in source": the file in full and the
  // line it is declared on; empty and zero when the build does not say.
  string source_path = 12;
  uint32 line = 13;
}

message ProfileGroupView {
  string label = 1;
  uint64 calls = 2;
  uint64 self_nanoseconds = 3;
  string self_text = 4;
  double share = 5;
  // The share as a percentage, as a column shows it.
  string share_text = 6;
  repeated ProfileGroupView children = 7;
  // The measurement, when the group is one function.
  ProfileEntryView entry = 8;
}

message ProfileView {
  // Origin, then directory, then function; heaviest first.
  repeated ProfileGroupView groups = 1;
  repeated ProfileEntryView heaviest = 2;
  uint64 measured_nanoseconds = 3;
  string measured_text = 4;
  uint32 lost_functions = 5;
  bool is_profiling = 6;
  // What to say above the chart, including when there is nothing.
  string note = 7;
  // The life the profile was measured in.
  uint32 life = 8;
}

message FrameView {
  string name = 1;
  string origin = 2;
  uint32 depth = 3;
  double start = 4;
  double width = 5;
  uint64 calls = 6;
  string total = 7;
  string own = 8;
  double share = 9;
  // What a reader is told when they point at it.
  string caption = 10;
}

message FlameView {
  repeated FrameView frames = 1;
  uint32 depth = 2;
  string total = 3;
  string note = 4;
  bool is_watched = 5;
}

message StaticObjectView {
  string name = 1;
  string origin = 2;
  string directory = 3;
  string file_name = 4;
  uint64 bytes_used = 5;
  string size_text = 6;
  bool is_constant = 7;
}

message DirectoryShare {
  string directory = 1;
  string size_text = 2;
}

message StaticMemoryView {
  repeated StaticObjectView biggest = 1;
  repeated DirectoryShare by_directory = 2;
  uint32 object_count = 3;
  uint64 total_bytes = 4;
  uint64 writable_bytes = 5;
  uint64 firmware_bytes = 6;
  uint64 budget_bytes = 7;
  bool is_within_budget = 8;
  string total_text = 9;
  string writable_text = 10;
  string firmware_text = 11;
  // One line saying what is held and whether it fits.
  string summary = 12;
}

message StackFrameView {
  string function = 1;
  string origin = 2;
  string file_name = 3;
  uint64 bytes_used = 4;
  string size_text = 5;
}

message StackUsageView {
  repeated StackFrameView path = 1;
  repeated StackFrameView largest = 2;
  uint64 deepest_bytes = 3;
  uint32 deepest_depth = 4;
  string deepest_text = 5;
  bool path_is_complete = 6;
  bool is_measured = 7;
  string summary = 8;
}

message AllocationSiteView {
  string function = 1;
  string origin = 2;
  string file_name = 3;
  uint64 blocks = 4;
  uint64 bytes_used = 5;
  string size_text = 6;
}

message HeapUsageView {
  repeated AllocationSiteView outstanding = 1;
  uint64 allocations = 2;
  uint64 frees = 3;
  uint64 failures = 4;
  string live_text = 5;
  string peak_text = 6;
  string firmware_text = 7;
  uint64 untracked_blocks = 8;
  bool never_allocated = 9;
  bool is_watched = 10;
  string summary = 11;
  // The same as live_text and peak_text, as numbers to compare against.
  uint64 live_bytes = 12;
  uint64 peak_bytes = 13;
}

message MemoryView {
  StaticMemoryView static_memory = 1;
  StackUsageView stack = 2;
  HeapUsageView heap = 3;
  // The life the heap and the stack were counted in.
  uint32 life = 4;
  // Since when heap and stack were counted: "since the last reset · life 3";
  // empty before the first reset.
  string counted_since_text = 5;
}

message BusView {
  uint32 bus_id = 1;
  string kind = 2;
  string name = 3;
  uint32 bitrate_bps = 4;
  string display_bitrate = 5;
  bool accepts_messages = 6;
  // C5
  bool takes_address = 7;
  string address_label = 8;
  bool takes_extended = 9;
  uint32 max_payload_bytes = 10;
  uint32 max_address = 11;
  uint32 max_extended_address = 12;
  bool takes_line_ending = 13;
  bool supports_fd = 14;
  bool supports_remote = 15;
  ExchangeUnit exchange_unit = 16;
  // How much simulated time a frame takes on this bus, and a controller's
  // latency before it is placed; zero = instantaneous (version 2 behaviour).
  bool has_time_model = 17;
  uint32 controller_latency_us = 18;
  uint32 queue_depth = 19;       // what QUEUE_FULL means in numbers...
  ExchangeUnit queue_unit = 20;  // ...in frames (CAN, 32) or bytes (UART, 256)
}

// ---- Source code ----

// Whether a file is still the one the build saw. A count or a breakpoint
// belongs to a line as compiled; a changed file shows the kept copy.
enum SourceState {
  SOURCE_STATE_AS_BUILT = 0;
  SOURCE_STATE_CHANGED = 1;   // edited since; the kept copy is shown
  SOURCE_STATE_MISSING = 2;   // gone from disk; the kept copy is shown
  SOURCE_STATE_UNKEPT = 3;    // the build kept no copy; the disk is shown
  SOURCE_STATE_ON_DISK = 4;   // there is no build: static analysis reads the disk
}

message SourceFileView {
  string path = 1;            // what the file is asked for by
  string display_path = 2;    // relative to the project, or to its directory
  string origin = 3;          // firmware, device model, adapter, component, runtime
  bool is_header = 4;
  // The firmware or its device model; everything else is shown on request.
  bool is_project = 5;
  SourceState state = 6;
  string state_text = 7;
}

message SourceTreeView {
  // Firmware first, then the device model, then the rest; by name within.
  repeated SourceFileView files = 1;
  string note = 2;
}

message SourceRequest {
  string path = 1;
  // The file as it is on disk now, rather than the copy the build kept.
  bool from_disk = 2;
}

message SourceText {
  string path = 1;
  bool as_built = 2;          // this is the copy the build kept
  string text = 3;
  string digest = 4;          // changes whenever the text does
  SourceState state = 5;
  string state_text = 6;
  string note = 7;            // e.g. that the file changed after the build
}

enum SymbolKind {
  SYMBOL_KIND_UNSPECIFIED = 0;
  SYMBOL_KIND_FUNCTION = 1;
  SYMBOL_KIND_ADAPTER_CALL = 2;     // a function the simulated adapter answers
  SYMBOL_KIND_GLOBAL_VARIABLE = 3;  // can be watched
  SYMBOL_KIND_STATIC_VARIABLE = 4;
  SYMBOL_KIND_LOCAL_VARIABLE = 5;
  SYMBOL_KIND_PARAMETER = 6;
  SYMBOL_KIND_FIELD = 7;
  SYMBOL_KIND_MACRO = 8;
  SYMBOL_KIND_ENUM_CONSTANT = 9;
  SYMBOL_KIND_TYPE = 10;
}

message SemanticSpan {
  uint32 line = 1;            // from one
  uint32 column = 2;          // bytes of UTF-8 into the line, from zero
  uint32 length = 3;          // bytes
  SymbolKind kind = 4;
  string kind_text = 5;
  string name = 6;            // the variable, function or adapter function
  string caption = 7;         // type and name, as a hint shows them
  string declared_path = 8;   // empty when unknown
  uint32 declared_line = 9;   // zero when unknown
}

message FunctionExtentView {
  string name = 1;
  string signature = 2;
  uint32 first_line = 3;
  uint32 last_line = 4;
}

message LineRange {
  uint32 first_line = 1;
  uint32 last_line = 2;
}

message SemanticsView {
  string path = 1;
  string digest = 2;          // the text the spans belong to
  repeated SemanticSpan spans = 3;
  repeated FunctionExtentView functions = 4;
  repeated LineRange inactive = 5;   // left out by the preprocessor
  string note = 6;
}

// ---- Line counts (a counting build) ----

message LineCountEntry {
  uint32 line = 1;
  uint64 count = 2;           // exact
  string count_text = 3;      // short: 1.2k
  uint32 heat = 4;            // 0 never .. 8 as often as the most run line of the file
  uint32 branches = 5;        // ways out of the line
  uint32 branches_taken = 6;  // ways taken at least once
  bool partly_run = 7;        // ran, but part of it never did
  // Lately: over the window of LineCountView.window_us, simulated time.
  uint64 recent = 8;          // runs in the window, exact
  string rate_text = 9;       // per second of simulated time: 480/s, <0.1/s
  uint32 rate_heat = 10;      // 0 not lately .. 8 as fast as the fastest line of the file
  // The run of lines this one belongs to: lines of one function that ran
  // equally often, in all and lately, with nothing before the last that
  // decides anything. A client may draw their counts once for all of them.
  uint32 group_first = 11;
  uint32 group_last = 12;
}

message FunctionCountView {
  string name = 1;
  string path = 2;
  uint32 first_line = 3;
  uint32 last_line = 4;
  uint64 calls = 5;
  string calls_text = 6;
  uint32 lines = 7;           // lines of it that can run
  uint32 lines_run = 8;
  // Host cost from the profiler, when it measured the function: this PC's
  // clock, so it says which code costs more, never how long on the target.
  bool has_host_cost = 9;
  string host_self_text = 10;
  string host_share_text = 11;
  uint64 recent_calls = 12;   // calls in the window of the rate
  string calls_rate_text = 13;
}

message LineCountView {
  string path = 1;
  bool counting = 2;          // the build counts lines at all
  bool is_counted = 3;        // and this file is one it counts
  repeated LineCountEntry lines = 4;   // only lines that can run
  repeated FunctionCountView functions = 5;
  uint64 since_us = 6;
  uint64 at_us = 7;
  string since_text = 8;
  string summary_text = 9;
  string note = 10;
  uint64 window_us = 11;           // the simulated time the rates are measured over
  string rate_window_text = 12;    // "over the last 1 s of simulated time"
}

message FileCoverage {
  string path = 1;
  uint32 lines = 2;
  uint32 lines_run = 3;
  uint32 never_run = 4;
  string share_text = 5;
}

message CoverageView {
  bool counting = 1;
  repeated FileCoverage files = 2;     // most lines never run first
  repeated FunctionCountView never_called = 3;
  uint32 lines = 4;
  uint32 lines_run = 5;
  string share_text = 6;
  uint64 since_us = 7;
  uint64 at_us = 8;
  string since_text = 9;
  string summary_text = 10;
  string note = 11;
}

message HotLine {
  string path = 1;
  uint32 line = 2;
  uint64 count = 3;
  string count_text = 4;
  string function = 5;
  uint64 recent = 6;
  string rate_text = 7;
}

message HotspotsView {
  bool counting = 1;
  repeated HotLine lines = 2;                 // ran most often first; exact
  repeated FunctionCountView functions = 3;   // called most often first
  repeated FunctionCountView costly = 4;      // most host time first
  string since_text = 5;
  string note = 6;
  repeated HotLine lines_by_rate = 7;                  // running most now first
  repeated FunctionCountView functions_by_rate = 8;    // called most now first
  string rate_window_text = 9;
}

// ---- Debugger ----

message BreakpointPlace {
  string path = 1;
  uint32 line = 2;
}

message DebugControl {
  oneof op {
    Empty attach = 1;
    Empty detach = 2;
    Empty resume = 3;              // run to the next breakpoint
    Empty step_over = 4;
    Empty step_into = 5;
    Empty step_out = 6;
    BreakpointPlace add_breakpoint = 7;   // attaches first when need be
    uint32 remove_breakpoint = 8;         // by its number
  }
}

message DebugFrame {
  uint32 level = 1;           // 0 where the firmware stands
  string function = 2;
  string path = 3;
  uint32 line = 4;
  string place_text = 5;      // app.c:73
}

message BreakpointView {
  uint32 number = 1;
  string path = 2;
  uint32 line = 3;            // where the debugger put it
  bool resolved = 4;          // false: no code at that line
  uint32 hits = 5;
}

message DebugVariable {
  string name = 1;
  string value = 2;
  string type = 3;
}

message DebugView {
  bool available = 1;         // a debugger can be attached at all
  bool attached = 2;
  bool stopped = 3;
  string status_text = 4;
  DebugFrame stopped_at = 5;
  repeated BreakpointView breakpoints = 6;
  repeated DebugFrame frames = 7;          // innermost first
  repeated DebugVariable variables = 8;    // of the frame it stands in
  string note = 9;            // why not available, or what was refused
}

// ---- Restart ----

message RestartRequest {
  bool rebuild = 1;
}

message BuildDiagnostic {
  string path = 1;
  uint32 line = 2;
  uint32 column = 3;        // zero when the compiler did not say
  string severity = 4;      // "error" or "warning"
  string message = 5;
}

message BuildResult {
  bool failed = 1;
  string title_text = 2;
  string summary_text = 3;                 // "2 errors · 1 warning"
  repeated BuildDiagnostic diagnostics = 4;  // errors first
  string output = 5;                       // everything the compiler said
}

enum RestartPhase {
  RESTART_PHASE_RUNNING = 0;
  RESTART_PHASE_BUILDING = 1;     // the old simulation runs on meanwhile
  RESTART_PHASE_RESTARTING = 2;   // the connection drops and comes back
}

message RestartView {
  RestartPhase phase = 1;
  bool can_restart = 2;
  string restart_unavailable = 3;
  bool can_rebuild = 4;
  string rebuild_unavailable = 5;
  BuildResult last_build = 6;     // unset when no build was asked for here
  uint64 generation = 7;          // restarts so far; tells one from the next
  string done_text = 8;           // what the last restart did, for a notice
}

// ---- Architecture ----

message ArchitectureRequest {
  uint64 known_revision = 1;  // zero: whatever there is
  string path = 2;            // only this file's functions; empty: all
}

enum Tier {
  TIER_GOOD = 0;
  TIER_NOTICEABLE = 1;
  TIER_CRITICAL = 2;
}

message IndexProgress {
  uint32 files_read = 1;
  uint32 files_total = 2;
  bool complete = 3;
  string text = 4;                  // "143 of 512 files read · flags from compile_commands.json"
  repeated string unreadable = 5;   // "can.c: line 12: unknown type name ..."
}

message MeasureDescription {
  string key = 1;          // "cognitive", "nesting", ... as every value names it
  string title = 2;        // column heading
  string description = 3;  // what it means and how it is counted
  bool judged = 4;         // held against limits; "returns" never is
}

message MeasureValue {
  string key = 1;
  double value = 2;
  string value_text = 3;
  Tier tier = 4;
  string limit_text = 5;   // "critical from 25"
  string explanation = 6;  // only when not good: what it means and what helps
}

message FunctionMeasures {
  string name = 1;
  string signature = 2;
  string path = 3;
  uint32 first_line = 4;
  uint32 last_line = 5;
  string module = 6;
  bool is_static = 7;
  repeated MeasureValue measures = 8;   // in the order of the descriptions
  Tier worst_tier = 9;
}

message FunctionMetricsView {
  uint64 revision = 1;
  bool unchanged = 2;
  IndexProgress progress = 3;
  string profile = 4;                   // "HIS-like"
  repeated MeasureDescription measures = 5;
  repeated FunctionMeasures functions = 6;
  string note = 7;
}

message FileMeasures {
  string path = 1;
  string display_path = 2;
  string module = 3;
  repeated MeasureValue measures = 4;
  Tier worst_tier = 5;
}

message FileMetricsView {
  uint64 revision = 1;
  bool unchanged = 2;
  IndexProgress progress = 3;
  string profile = 4;
  repeated MeasureDescription measures = 5;
  repeated FileMeasures files = 6;
}

message ArchitectureFocus {
  string node_id = 1;          // "" the project, "layer:app", "module:app/blinker"
  string focus = 2;            // "module:..." to draw its neighbourhood instead
  uint32 depth = 3;            // rings of a focus, 1 to 3
  repeated string kinds = 4;   // calls, reads, writes, address, types, macros, includes; empty: the use graph
  uint64 known_revision = 5;
}

message ArchitectureCrumb {
  string node_id = 1;
  string title = 2;
  string kind = 3;             // project, layer, module
}

message ArchitectureBand {
  string name = 1;             // "" for what no layer claims
  string title = 2;
  bool is_scope = 3;
  bool proposed = 4;
}

message ArchitectureNode {
  string node_id = 1;
  string kind = 2;             // layer, module, function, stub
  string title = 3;
  uint32 band = 4;
  string metrics_text = 5;
  uint32 critical = 6;
  uint32 noticeable = 7;
  string cycle_id = 8;
  bool has_children = 9;
  string path = 10;
  uint32 line = 11;
  sint32 ring = 12;            // in a focus: users negative, used positive
  string caption = 13;
  Tier worst_tier = 14;
}

message ArchitectureEdge {
  string edge_id = 1;          // "<from>-><to>"
  string from_id = 2;
  string to_id = 3;
  uint32 weight = 4;           // places
  string kinds_text = 5;       // "calls 12 · reads 3"
  string direction = 6;        // down, sideways, up
  string violation = 7;
  string exception = 8;
  string cycle_id = 9;
  bool in_cut = 10;            // in the cut proposed to break its cycle
}

message ArchitectureCycle {
  string cycle_id = 1;
  string text = 2;
}

message ArchitectureGraph {
  uint64 revision = 1;
  bool unchanged = 2;
  IndexProgress progress = 3;
  repeated ArchitectureCrumb crumbs = 4;
  repeated ArchitectureBand bands = 5;
  repeated ArchitectureNode nodes = 6;
  repeated ArchitectureEdge edges = 7;
  repeated ArchitectureCycle cycles = 8;
  string banner = 9;
  string shown_text = 10;
}

message FindingFilter {
  string node_id = 1;          // "" every finding
  uint64 known_revision = 2;
}

message CodePlace {
  string path = 1;
  uint32 line = 2;
  string kind = 3;
  string what = 4;
}

message ArchitectureFinding {
  string key = 1;              // kind and subject, stable across edits
  string kind = 2;
  Tier severity = 3;
  string title = 4;
  string explanation = 5;
  repeated CodePlace places = 6;
  repeated string node_ids = 7;
  repeated string edge_ids = 8;
  string function = 9;
  string state = 10;           // new, known, accepted -- against the baseline
  string note = 11;            // what it was accepted with
}

message FindingList {
  uint64 revision = 1;
  bool unchanged = 2;
  repeated ArchitectureFinding findings = 3;
  bool complete = 4;
  string note = 5;
  repeated string fixed = 6;   // keys of accepted findings no longer found
}

message PlacesRequest {
  string edge_id = 1;
  repeated string kinds = 2;
}

message PlaceList {
  repeated CodePlace places = 1;
}

message LayerRuleView {
  string name = 1;
  repeated string folders = 2;
  repeated string patterns = 3;
  bool may_skip = 4;
  uint32 modules = 5;
}

message DependencyRuleView {
  string user = 1;             // "layer:app" or "module:app/blinker"
  string used = 2;
  string reason = 3;
}

message ArchitectureRulesView {
  string revision = 1;
  string path = 2;
  bool is_proposed = 3;
  string problem = 4;
  repeated LayerRuleView layers = 5;
  repeated DependencyRuleView exceptions = 6;
  repeated DependencyRuleView prohibitions = 7;
}

message RuleChange {
  // add layer, remove layer, rename layer, move layer, assign folder,
  // unassign folder, add pattern, remove pattern, set skip, add exception,
  // remove exception, add prohibition, remove prohibition, keep
  string operation = 1;
  string layer = 2;
  string name = 3;
  uint32 position = 4;
  string folder = 5;
  string pattern = 6;
  bool may_skip = 7;
  string user = 8;
  string used = 9;
  string reason = 10;
  repeated string folders = 11;
  repeated string patterns = 12;
}

message RuleChangeRequest {
  RuleChange change = 1;
  string base_revision = 2;   // the rules' revision the change was made against
  bool dry_run = 3;           // only say what it would do
}

message RuleChangeReply {
  string revision = 1;        // of the rules after the change
  RuleChange inverse = 2;     // what undoes it
  string effect = 3;          // "3 modules change layer."
}

message AcceptFindingsRequest {
  repeated string keys = 1;
  string note = 2;
  bool every = 3;              // every finding found now: take a baseline
}

message MachineSummary {
  string machine_id = 1;
  string name = 2;
  string kind_text = 3;        // "switch over an enum"
  string module = 4;
  uint32 states = 5;
  uint32 transitions = 6;
  string display_name = 7;     // the name, with its file when two machines share it
  string carrier_text = 8;     // "file-static variable", "field of pulse_t"
  string naming_text = 9;      // "enum show_state_t", "named values (#define)"
  repeated string parent_ids = 10;  // the machines it runs inside; empty at the top
  uint32 depth = 11;           // how deep it is nested, 0 at the top
  string nesting_note = 12;    // why it is not nested although it runs inside a state
  string parent_text = 13;     // "in SHOW_RUNNING"
  NestingKind nesting = 14;
}

// How a machine relates to the machines it runs inside.
enum NestingKind {
  NESTING_KIND_NONE = 0;             // runs inside no state of another machine
  NESTING_KIND_INSIDE = 1;           // only inside states of one machine
  NESTING_KIND_ALSO_OUTSIDE = 2;     // inside a state and also from elsewhere: not nested
  NESTING_KIND_SEVERAL_PARENTS = 3;  // inside states of two or more machines
}

// How a parent's transition starts or leaves an inner machine.
enum InnerEntryKind {
  INNER_ENTRY_KIND_RESET = 0;           // the same branch assigns the inner variable
  INNER_ENTRY_KIND_RESUME = 1;          // nothing assigns it: it goes on where it was
  INNER_ENTRY_KIND_RESET_ON_EXIT = 2;   // the branch that leaves the state assigns it
}

message InnerEntry {
  string machine_id = 1;       // the inner machine
  InnerEntryKind kind = 2;
  string state = 3;            // the inner state a reset sets; empty for a resume
  string text = 4;             // "Enters expander_state at EXPANDER_PROBE – …"
  sint32 count = 5;            // how often the run took it; -1 when not followed
  string parent_state = 6;     // the parent's state it comes from: "SHOW_IDLE"
  string transition_id = 7;    // the parent's transition
  string label = 8;            // on the inner frame: "reset from SHOW_IDLE"
}

// An inner machine a state runs.
message Submachine {
  string machine_id = 1;
  string name = 2;
  string via_text = 3;         // "expander_step() in case SHOW_RUNNING"
  string path = 4;             // where the call is
  uint32 line = 5;
  string current_text = 6;     // the inner state while followed: "CHASE_UP", "held at CHASE_DOWN"
  NestingKind kind = 7;
}

// A machine an inner machine runs inside.
message MachineParent {
  string machine_id = 1;
  string name = 2;
  repeated string states = 3;
  string via_text = 4;
}

message StateMachineList {
  repeated MachineSummary machines = 1;
}

message StateMachineChoice {
  string machine_id = 1;
}

message MachineState {
  string name = 1;
  bool is_initial = 2;
  bool reached = 3;            // true when the run is not followed
  string dwell_text = 4;       // "dwell 18 % · 4×"
  bool is_current = 5;
  string value = 6;            // the enum value, "1"; empty when unknown
  string path = 7;             // where its case is; empty when no case names it
  uint32 line = 8;
  repeated string do_calls = 9;  // what its case calls outside any if: "lights_off()"
  repeated Submachine submachines = 10;  // the machines it runs; their calls are not do_calls
  bool held = 11;              // an inner machine's state while its parent is elsewhere
  string held_text = 12;       // "Held in CHASE_DOWN while show_state is in SHOW_PAUSED"
}

// Where a machine comes from in the code.
enum TransitionOrigin {
  TRANSITION_ORIGIN_STATE = 0;   // an assignment in a case: leaves that case's states
  TRANSITION_ORIGIN_ANY = 1;     // outside the switch: can happen in any state
  TRANSITION_ORIGIN_INIT = 2;    // reserved: the setup is the initial state, not a transition
  TRANSITION_ORIGIN_PARENT_ENTRY = 3;  // set by the parent's step: an entry, drawn as a mark
}

// What a transition on the diagram rests on.
enum TransitionEvidence {
  TRANSITION_EVIDENCE_CODE = 0;            // the code writes it
  TRANSITION_EVIDENCE_BETWEEN_PASSES = 1;  // the run made it, the code writes no such step
  TRANSITION_EVIDENCE_NOT_IN_CODE = 2;     // reserved: with the exact recording
  TRANSITION_EVIDENCE_OUTSIDE_PARENT = 3;  // reserved: an inner machine moved outside its parent
}

// An if chain that leads a state two or more ways: a choice pseudostate.
message MachineChoice {
  string choice_id = 1;
  string state = 2;            // the state it leaves
  string path = 3;             // where the chain's first if is
  uint32 line = 4;
  string stay_text = 5;        // "otherwise stays in SHOW_RUNNING"; empty with an else
}

message MachineTransition {
  string source = 1;           // "*": from any state
  string target = 2;
  string condition = 3;
  string path = 4;
  uint32 line = 5;
  string function = 6;
  string note = 7;
  sint32 count = 8;            // taken in the run; -1 when not followed
  bool observed_only = 9;      // the run made it, the code writes no such step
  bool count_shared = 10;      // the count is of every transition between these two
                               // states: the run cannot tell which one was taken
  TransitionOrigin origin = 11;
  string transition_id = 12;   // stable across answers while the code is unchanged
  string guard_text = 13;      // all that must hold, earlier arms negated
  string effect_text = 14;     // "pauses_left--; since_ms = now_ms"
  string guard_note = 15;      // "calls move_light – the condition has an effect"
  string choice_id = 16;       // the MachineChoice it leaves through; empty for none
  uint32 branch_order = 17;    // its arm in the if chain, from 1; 0 outside one
  bool is_else = 18;           // the chain's else: drawn [else]
  string order_text = 19;      // "2nd of 3 in the if chain at light_show.c:113"
  TransitionEvidence evidence = 20;  // replaces observed_only
  repeated InnerEntry inner_entries = 21;  // how it starts or leaves the inner machines
}

// Named apart from the StateModels of the device models.
message FirmwareStateMachine {
  string machine_id = 1;
  string name = 2;
  string kind_text = 3;
  string where_text = 4;       // "switch in blinker_step (blinker.c:22)"
  string path = 5;
  uint32 line = 6;
  repeated MachineState states = 7;
  string initial_note = 8;
  repeated MachineTransition transitions = 9;
  bool found = 10;
  bool observed = 11;
  string observation_text = 12;   // how exact: once per loop pass
  string coverage_text = 13;
  string instance = 14;           // the variable followed
  string display_name = 15;
  string carrier_text = 16;
  string naming_text = 17;
  repeated string instance_choices = 18;  // a field machine's variables; empty otherwise
  bool is_field = 19;             // a field machine, also when no instance was found
  string initial_text = 20;       // "light_show_init()", "= SHOW_IDLE at definition",
                                  // "value 0 – C default"
  repeated MachineChoice choices = 21;
  repeated MachineParent parents = 22;  // the machines it runs inside
  string nesting_note = 23;
  repeated InnerEntry entries = 24;     // how its parents start it: the marks on its frame
  NestingKind nesting = 25;
  string held_while_text = 26;  // "held while SHOW_IDLE, SHOW_PAUSED, SHOW_STOPPING"
  string follow_note = 27;      // "followed together with show_state"
}

message MachineFollowRequest {
  string machine_id = 1;
  string variable_path = 2;       // the variable that holds it, an instance for a field
  bool follow = 3;
  bool with_parent = 4;           // follow the machine it runs inside too: states relative to it
}

// --- Sequences (architecture analysis, stage 4) ---

message CallTreeRequest {
  string function = 1;          // by name
  uint32 depth = 2;             // how many calls deep, 1 to 6
}

enum LifelineKind {
  LIFELINE_KIND_MODULE = 0;
  LIFELINE_KIND_EXTERNAL = 1;   // functions the project does not define
  LIFELINE_KIND_DEVICE = 2;     // a bus device or peripheral
  LIFELINE_KIND_ISR = 3;
}

message SequenceLifeline {
  string lifeline_id = 1;
  string name = 2;              // ":light_show"
  string caption = 3;           // its layer
  LifelineKind kind = 4;
  string stereotype = 5;        // "device"; empty otherwise
}

// A UML combined fragment.
enum FragmentKind {
  FRAGMENT_KIND_LOOP = 0;
  FRAGMENT_KIND_ALT = 1;        // an if chain or a switch
  FRAGMENT_KIND_OPT = 2;        // a lone if
  FRAGMENT_KIND_REF = 3;        // a group folded away
}

message SequenceFragment {
  string fragment_id = 1;
  FragmentKind kind = 2;
  string parent_id = 3;         // the fragment it lies in; empty at the top
  repeated string guards = 4;   // per operand, in order: "[over_current]", "[else]"; empty when unknown
  string path = 5;
  uint32 line = 6;
}

message FragmentOperand {
  string fragment_id = 1;
  uint32 operand = 2;           // from 1
}

enum MessageKind {
  MESSAGE_KIND_CALL = 0;
  MESSAGE_KIND_RETURN = 1;
  MESSAGE_KIND_FOUND = 2;       // a handler the simulation runs: nobody in the firmware calls it
  MESSAGE_KIND_HAL = 3;
  MESSAGE_KIND_BUS = 4;
}

message SequenceMessage {
  uint32 order = 1;
  string from_lifeline = 2;
  string to_lifeline = 3;
  string label = 4;             // "expander_step()"
  MessageKind kind = 5;
  uint32 depth = 6;             // calls deep
  string path = 7;              // where the call is written
  uint32 line = 8;
  repeated FragmentOperand fragments = 9;  // outermost first
  bool cut = 10;                // the callee makes calls that are not shown
}

message CallTree {
  string function = 1;
  bool found = 2;
  repeated string functions = 3;  // what a tree can start from, by name
  repeated SequenceLifeline lifelines = 4;
  repeated SequenceMessage messages = 5;
  repeated SequenceFragment fragments = 6;
  string banner_text = 7;       // "Static – the order of the calls in the code, not what ran."
}

message SequenceFollowRequest {
  bool follow = 1;              // false stops the recording
  repeated string lifeline_ids = 2;  // the modules to record; none for every module
}

message SequenceRequest {
  uint64 from_us = 1;
  uint64 to_us = 2;             // 0: the last 10 ms of the run
}

// One pass of the loop, or a run of passes that were all alike.
message SequencePass {
  uint64 sim_us = 1;            // when the first of them ran
  string header_text = 2;       // "12.400 s", "12.400–12.460 s · loop ×12"
  uint32 repeats = 3;
  repeated SequenceMessage messages = 4;  // order counts from 1 within the pass
}

message RecordedSequence {
  bool recording = 1;
  repeated string recorded = 2;            // the lifelines recorded, by id
  repeated SequenceLifeline choices = 3;   // every module that could be one
  repeated SequenceLifeline lifelines = 4; // of the drawing, in order
  repeated SequencePass passes = 5;        // oldest first
  uint64 from_us = 6;
  uint64 to_us = 7;
  string range_text = 8;        // "12.400–12.410 s"
  string recording_text = 9;    // "Recording app, light_show since 12.380 s"
  string state_text = 10;       // why there is nothing to draw, or empty
  string banner_text = 11;      // lost or cut, or empty
  uint32 message_count = 12;
}

// ---- Interrupts ----------------------------------------------------------------

message InterruptRaise {
  uint32 source_id = 1;
  When when = 2;
}

// One interrupt source and what it did in this life. Every text is the
// server's; times are simulated.
message InterruptSourceView {
  uint32 source_id = 1;
  string name = 2;
  string kind_text = 3;        // "pin 3, falling edge", "timer, every 1 ms"
  uint32 line = 4;
  uint32 priority = 5;
  bool enabled = 6;
  bool pending = 7;
  string handler = 8;          // "HAL_GPIO_EXTI_Callback", "" without one
  uint64 raised = 9;
  uint64 handled = 10;
  uint64 lost = 11;
  uint64 latency_max_us = 12;
  string latency_text = 13;    // "mean 3 µs · max 48 µs", "–" before the first
  uint64 duration_max_us = 14;
  string duration_text = 15;
  string host_text = 16;       // "mean 0.8 µs on the host"
  uint64 period_us = 17;       // a timer's, 0 otherwise
  bool is_raisable = 18;       // a client may raise it
  uint64 raised_by_race = 19;
  string state_text = 20;      // "idle", "pending", "running", "disabled"
  uint64 latency_mean_us = 21;
  uint64 duration_mean_us = 22;
}

// The global lock (PRIMASK) in this life.
message InterruptLockView {
  bool disabled_now = 1;
  uint64 sections = 2;
  uint64 longest_us = 3;
  string longest_text = 4;     // "38 µs at 12.3011 s"
  uint64 longest_at_us = 5;
  CodePlace longest_place = 6; // where the longest section was locked
  uint64 total_us = 7;
  string share_text = 8;       // "disabled 0.4 % of the time"
  uint64 limit_us = 9;         // [interrupts] max_disabled from looper.toml, 0 without
  string limit_text = 10;
  string state_text = 11;      // "enabled", "disabled since 12.3010 s"
  uint64 held_back = 12;       // interruption points at which the lock held a ready source back
}

message InterruptReport {
  repeated InterruptSourceView sources = 1;
  InterruptLockView lock = 2;
  string points_text = 3;      // "Interruption points: adapter calls, waits, the end of a pass"
  string note = 4;             // the time model, or why nothing is there
  bool installed = 5;          // the firmware called an interrupt role, so the counts are live
}

// ---- DMA (free; the guard is Pro) ----------------------------------------------

// One DMA channel: from contract.toml before the firmware starts it, with
// its counts in this life. The buffer is named from DWARF where it can be.
message DmaChannelView {
  uint32 dma_id = 1;
  string name = 2;
  string peripheral_text = 3;  // "UART 2 -> rx_buf"
  string direction = 4;        // "receive", "transmit"
  string mode = 5;             // "normal", "circular"
  bool running = 6;
  string buffer_name = 7;      // "rx_buf", "" where DWARF does not say
  uint64 buffer_address = 8;
  uint32 buffer_bytes = 9;     // the variable's size from DWARF, 0 unknown
  uint32 length = 10;          // elements of the transfer
  uint32 width = 11;           // bytes per element
  uint32 position = 12;        // the element written next
  uint32 announced = 13;       // elements the firmware was told of by half, end or idle
  uint64 laps = 14;
  uint64 elements = 15;
  uint64 overruns = 16;
  uint64 unclaimed = 17;
  DmaGuard guard = 18;
  string guard_text = 19;      // "precise", "coarse: the neighbours trapped too often", "Pro"
  uint64 neighbour_traps = 20;
  repeated string neighbours = 21;  // variables sharing the buffer's pages, from DWARF
  string state_text = 22;      // "running, lap 3, at 12 of 64", "stopped", "not started"
}

enum DmaGuard {
  DMA_GUARD_OFF = 0;
  DMA_GUARD_PRECISE = 1;
  DMA_GUARD_COARSE = 2;
  DMA_GUARD_DOWNGRADED = 3;
  DMA_GUARD_UNAVAILABLE = 4;
  DMA_GUARD_DEBUGGER = 5;
  DMA_GUARD_STACK = 6;
  DMA_GUARD_LOCKED = 7;        // the platform could, the licence does not cover it (RUN_FINDINGS)
}

message DmaReport {
  repeated DmaChannelView channels = 1;
  string note = 2;             // why nothing is there, or what the guard does
  bool installed = 3;          // the firmware called a DMA or interrupt role, so the counts are live
}

// ---- Run findings (Pro) --------------------------------------------------------

message RunFindingFilter {
  repeated string kinds = 1;   // "IRQ_LOCK_TOO_LONG", ...; empty: every kind
  uint64 known_revision = 2;
}

// One finding of the run: a fact of the runtime judged by the server.
message RunFinding {
  string key = 1;              // kind, source or channel, place: the same across runs
  string kind = 2;             // IRQ_LOCK_TOO_LONG, IRQ_LOST, IRQ_LONGER_THAN_PERIOD, IRQ_LATENCY, IRQ_STORM, IRQ_NEVER_HANDLED, DMA_*
  Tier severity = 3;
  string title = 4;            // "Interrupts disabled for 2 ms (limit 1 ms)"
  string explanation = 5;
  uint64 sim_us = 6;           // first time it happened
  uint64 event_seq = 7;        // the event to jump to in Logic
  uint32 occurrences = 8;
  uint32 source_id = 9;        // 0 without
  uint32 dma_id = 10;          // 0 without
  repeated CodePlace places = 11;
  string check_text = 12;      // the looper-py check that expects it away: check.interrupt("TIM2").never_lost()
}

message RunFindingList {
  uint64 revision = 1;
  bool unchanged = 2;
  repeated RunFinding findings = 3;
  string note = 4;
}

// ---- Race mode (Pro) -------------------------------------------------------------

// Raise one source at every interruption point of the loop in turn, or stop.
message RaceRequest {
  bool on = 1;
  uint32 source_id = 2;
  RaceStrategy strategy = 3;
}

enum RaceStrategy {
  RACE_STRATEGY_ROUND_ROBIN = 0;   // in pass p at the point with index p mod N
}

// What the race mode did since it was switched on. The points are the
// firmware's interruption points outside ISRs, told apart by address and
// shown by the function that holds them.
message RaceView {
  bool on = 1;
  uint32 source_id = 2;
  string source_name = 3;
  uint32 points_seen = 4;
  uint32 points_covered = 5;
  uint64 cycles = 6;
  string coverage_text = 7;          // "37 of 41 points, 2 cycles"
  repeated CodePlace uncovered = 8;  // functions with points not raised at yet
  Ack ack = 9;                       // SetRaceMode: refused, with the sentence
}

// ---- Chains -------------------------------------------------------------------
//
// A chain is a part of the signal graph that acts at a moment: conditions
// fire where the simulation records their facts, logic passes an event on,
// actions send, set, mark or hold at the same simulated time. A group is a
// chain with a name and a switch. The server checks the graph, says which
// parts are Pro, and words every text; the runtime evaluates the chains. A
// Logic trigger is a chain too: ObserveChains lists it as a locked group
// "logic:<trigger_id>".

// An event or state link between two event blocks, by node key and port
// index (the index into ChainBlockKind.inputs and .outputs).
message EventLinkRequest {
  string from_node = 1;
  uint32 from_port = 2;
  string to_node = 3;
  uint32 to_port = 4;
  bool is_state = 5;         // a state link (a level that holds); otherwise an event link
}

// A named chain round some blocks. `enabled` is the saved state; a click
// switches it with SwitchChainGroup without sending the graph again.
message ChainGroupRequest {
  string group_key = 1;
  string name = 2;           // unique among groups; the chain's name in Logic
  bool enabled = 3;
}

// What an event block does. One of the settings, by its category.
message ChainBlockRequest {
  oneof settings {
    TriggerCondition condition = 1;     // the conditions Logic and chains share
    ThresholdSettings threshold = 2;
    ChainLogic logic = 3;
    ChainAction action = 4;
  }
  uint64 min_gap_us = 5;     // a condition: the least time between two fires; 0 none
}

message BusReceivedCondition {
  uint32 bus_id = 1;
  uint32 address = 2;
  uint32 address_mask = 3;   // 0: every bit
  bool extended = 4;
  Direction direction = 5;   // OUTBOUND from the firmware, INBOUND to it, UNSPECIFIED either
  bytes pattern = 6;         // the bytes the message starts with; UART: the text as bytes
  bytes pattern_mask = 7;    // which bits of `pattern` count; empty: all
}

message BusTimeoutCondition {
  uint32 bus_id = 1;
  uint32 address = 2;
  uint32 address_mask = 3;
  bool extended = 4;
  Direction direction = 5;
  uint64 duration_us = 6;
  bool after_first_message = 7;   // false: counts from switching on
}

message ClockCondition {
  uint64 period_us = 1;
  uint64 phase_us = 2;       // the first fire, then every period
}

message StartCondition {
  bool first_life_only = 1;  // false: at 0 s and after every reset
}

message InterruptCondition {
  uint32 source_id = 1;
  bool on_entry = 2;         // false: when it becomes pending
}

message ResetCondition {
  ResetCause cause = 1;      // UNSPECIFIED: any
}

// Reads the node's signal input 0.
message ThresholdSettings {
  double level = 1;
  double hysteresis = 2;
  EdgePolarity direction = 3;     // RISE: rises above, FALL: falls below, ANY: either
  uint64 check_us = 4;            // 0: the server's default
}

message ChainLogic {
  oneof kind {
    DelayLogic delay = 1;
    CounterLogic counter = 2;
    Empty once = 3;
    Empty all_of = 4;        // And
    Empty any_of = 5;        // Or
    Empty gate = 6;
    SequenceLogic sequence = 7;   // Pro
  }
}

message DelayLogic {
  uint64 delay_us = 1;
  enum WhileWaiting {
    QUEUED = 0;
    RESTART = 1;
    DROPPED = 2;
  }
  WhileWaiting while_waiting = 2;
}

message CounterLogic {
  uint32 n = 1;
  bool only_nth = 2;         // false: every n-th
}

message SequenceLogic {
  repeated SequenceStepRequest steps = 1;
  bool restart_on_start = 2;
}

message SequenceStepRequest {
  enum Kind {
    DO = 0;
    WAIT = 1;
    WAIT_FOR = 2;
    EXPECT_NONE = 3;
  }
  Kind kind = 1;
  string label = 2;
  uint64 duration_us = 3;    // WAIT: the time; WAIT_FOR: the limit; EXPECT_NONE: the span; 0 none
}

message ChainAction {
  oneof kind {
    BusMessageAction send = 1;
    BusMessageAction reply = 2;   // Pro
    PinAction pin = 3;
    MarkAction mark = 4;
    HoldAction hold = 5;
    SignalSwitchAction signal = 6;
    FaultAction fault = 7;        // Pro
    InterruptRaiseAction interrupt = 8;
    ResetAction reset = 9;
  }
}

message BusMessageAction {
  BusMessage message = 1;
  repeated MessageField fields = 2;   // Pro; empty: the payload as it is
  uint64 answer_after_us = 3;         // reply only; 0: the same moment
  string text = 4;                    // UART: the text instead of bytes
  uint32 length = 5;                  // with fields: the message length in bytes
}

message MessageField {
  string name = 1;
  oneof source {
    uint64 constant = 2;
    uint32 signal_input = 3;   // index into the node's `inputs`
    uint32 request_bit = 4;    // reply: the start bit in the received message
    Empty count = 5;           // adds 1 per send, wraps at the width
  }
  uint32 start_bit = 6;
  uint32 length = 7;
  bool big_endian = 8;
  bool is_signed = 9;
  double scale = 10;         // 0 is read as 1
  double offset = 11;
  string dbc_message = 12;   // taken from a DBC: its message's name
}

message PinAction {
  uint32 pin_id = 1;
  enum Do {
    HIGH = 0;
    LOW = 1;
    PRESS = 2;
  }
  Do action = 2;
  enum PressLevel {
    ACTIVE = 0;
    PRESS_HIGH = 1;
    PRESS_LOW = 2;
  }
  PressLevel press_level = 3;
  uint64 press_us = 4;
}

message MarkAction {
  string text = 1;
}

message HoldAction {
  uint64 after_us = 1;
}

message SignalSwitchAction {
  string node = 1;           // a generator or value node, by key; empty with channel_id
  uint32 channel_id = 2;     // an input channel (HOLD_AT)
  enum Do {
    START = 0;
    STOP = 1;
    STEP = 2;
    RAMP = 3;
    SET = 4;
    HOLD_AT = 5;
  }
  Do action = 3;
  double to = 4;
  uint64 over_us = 5;
}

message FaultAction {
  enum Kind {
    STICK = 0;
    NOISE_ON = 1;
    NOISE_OFF = 2;
    DROP = 3;
    ERROR_FRAME = 4;
    FLIP = 5;
    POWER_CUT = 6;           // also needs PRO_FEATURE_BOOTLOADER
  }
  Kind kind = 1;
  uint32 channel_id = 2;
  // STICK: how long, 0 until switched off. POWER_CUT: how long the board
  // stays without power before the next life begins.
  uint64 for_us = 3;
  double amplitude = 4;
  uint32 bus_id = 5;
  uint32 address = 6;
  uint32 address_mask = 7;
  uint32 next = 8;
  uint32 byte_index = 9;
  uint32 bit = 10;
}

message InterruptRaiseAction {
  uint32 source_id = 1;
}

message ResetAction {
  ResetCause cause = 1;      // PIN, POWER_ON, BROWN_OUT
}

// Something a block of a chain did, at Event.sim_us. The runtime's record
// passed on unchanged, so it names the block by its position in the
// installed table; ChainNodeView.block maps the position to the node.
message ChainFire {
  enum Kind {
    FIRED = 0;     // a condition or a logic block let an event through
    ACTED = 1;     // an action was carried out
    STEP = 2;      // a sequence moved to `step`
    DONE = 3;      // a sequence ended, a once passed
    FAILED = 4;    // a sequence step timed out, or an expected-none came
    DROPPED = 5;   // an event found no room (a delay's queue was full)
    LOOPED = 6;    // too many events at one instant; the chain was taken out
  }
  uint32 chain_id = 1;
  uint32 block = 2;
  Kind kind = 3;
  uint32 fire_n = 4;         // the block's count after this fire, from 1
  uint64 hold_at_us = 5;     // a hold: when the simulation holds
  uint32 step = 6;           // STEP, FAILED: from 1
  string text = 7;           // a mark's text; otherwise empty
  uint32 cause_block = 8;    // the condition that started it, its position plus one; 0 none
}

// What is wrong with a graph's chains, and how full the table would be.
message GraphCheckView {
  repeated GraphProblem problems = 1;
  ChainCapacityView capacity = 2;
}

message GraphProblem {
  enum Kind {
    OPEN = 0;            // a port that has to be linked is not
    WRONG_PORT = 1;      // a link joins ports of two kinds
    CYCLE = 2;           // it would fire itself in the same moment
    UNKNOWN_TARGET = 3;  // no such pin, bus, channel or node
    INVALID = 4;         // a setting out of range
    CAPACITY = 5;        // more blocks than the runtime holds
    NEEDS_PRO = 6;       // kept, but not run without the licence
  }
  Kind kind = 1;
  string node_key = 2;
  string group_key = 3;
  string link = 4;           // "from:port -> to:port", for a link
  string text = 5;           // the sentence the window shows
}

message ChainCapacityView {
  uint32 conditions_used = 1;
  uint32 conditions_max = 2;
  uint32 actions_used = 3;
  uint32 actions_max = 4;
  uint32 logic_used = 5;
  uint32 logic_max = 6;
  string text = 7;           // "conditions 5 of 64 · logic 1 of 64 · actions 4 of 64"
}

message ChainList {
  repeated ChainNodeView nodes = 1;
  repeated ChainGroupView groups = 2;
  repeated SequenceStateView sequences = 3;
  ChainCapacityView capacity = 4;
  ViewPosition position = 5;   // the stream position the counts are up to
}

message ChainNodeView {
  string node_key = 1;       // "logic:<trigger_id>:condition" for a Logic trigger's block
  string group_key = 2;      // "logic:<trigger_id>" for a Logic trigger
  uint32 chain_id = 3;
  uint32 block = 4;          // the position in the table, as ChainFire.block; 0 when not installed
  bool installed = 5;        // false: switched off, refused, or needs Pro
  enum State {
    OFF = 0;
    ARMED = 1;
    FIRED = 2;
    DONE = 3;
    RUNNING = 4;
    FAILED = 5;
    HOLDING = 6;
    INCOMPLETE = 7;
    REFUSED = 8;
    NEEDS_PRO = 9;
  }
  State state = 6;
  string state_text = 7;     // Logic's chip words: "✶ fired 14× · last 2.500000 s"
  string summary_text = 8;   // "CAN1 · 0x7E0 · from firmware"
  string refusal_text = 9;
  uint32 fire_count = 10;    // kept while switched off
  uint64 last_fire_us = 11;
  string detail_text = 12;   // an action's last deed: "CAN1 0x7E8#02 41 00 at 2.500000 s"
  string interval_text = 13; // "mean 100.0 ms · shortest 99.8 ms · longest 100.4 ms"
  bool is_locked = 14;       // a Logic trigger's block: read in the editor, edited in Logic
  string kind = 15;          // the block kind, as ChainBlockKind.kind
  ChainBlockRequest settings = 16;   // a Logic trigger's block, so that the editor draws it as it is
  repeated string writes_also = 17;  // other chains writing its target: "chain \"Boost test\""
}

message ChainGroupView {
  string group_key = 1;
  string name = 2;
  bool enabled = 3;
  string state_text = 4;     // the group's chip
  uint32 event_blocks = 5;
  uint32 signal_blocks = 6;
  bool needs_pro = 7;
  string problem_text = 8;
  uint32 trigger_id = 9;     // a Logic trigger's group; 0 otherwise
  // A Logic trigger's group: the links between its blocks, by their
  // node_key, so that a client can copy it as a chain of its own. Empty for
  // a group of the graph, whose links are the client's.
  repeated EventLinkRequest links = 10;
}

message SequenceStateView {
  string node_key = 1;
  uint32 step_index = 2;     // from 1; 0 before the start; FAILED: the step that failed
  uint32 step_count = 3;
  enum State {
    WAITING = 0;
    RUNNING = 1;
    DONE = 2;
    FAILED = 3;
  }
  State state = 4;
  string step_text = 5;      // "▸ step 3 of 6"
  string failure_text = 6;   // "Failed at step 3: mode is BOOST did not come within 2 s · 4.200000 s"
  repeated uint64 step_times_us = 7;   // when each step was reached
}

message ChainGroupSwitch {
  string group_key = 1;
  bool enabled = 2;
  When when = 15;
}

// The blocks this server builds, with their ports and edition.
message ChainBlockCatalogue {
  repeated ChainBlockKind kinds = 1;
}

message ChainBlockKind {
  string kind = 1;           // "pin_edge", "bus_received", "delay", "bus_send", ...; "message_fields" for the Fields mode
  string category = 2;       // "condition", "logic", "action"
  string display_name = 3;
  string description = 4;
  repeated ChainPortView inputs = 5;
  repeated ChainPortView outputs = 6;
  bool is_pro = 7;
  bool is_locked = 8;        // Pro and no licence: it cannot be added
  string locked_text = 9;    // the popover's sentence
  uint32 step = 10;          // the plan step that built it
}

message ChainPortView {
  string name = 1;
  enum Kind {
    EVENT = 0;
    STATE = 1;
    SIGNAL = 2;
  }
  Kind kind = 2;
  bool grows = 3;            // And, Or: another appears when the last is linked, up to 8
}

message PytestExportRequest {
  string group_key = 1;
  uint64 run_for_us = 2;     // a chain without a Sequence runs this long; 0: 10 s
}

message PytestExport {
  string file_name = 1;      // "test_boost_test.py"
  string text = 2;
  repeated string warnings = 3;   // what the file could not carry over, one sentence each
}

message DbcRequest {
  string path = 1;           // on the server's disk
}

message DbcView {
  string path = 1;
  string problem = 2;        // why it could not be read; empty when it was
  repeated DbcMessageView messages = 3;
}

message DbcMessageView {
  string name = 1;           // "EngineData"
  uint32 address = 2;        // without the DBC's extended flag
  bool extended = 3;
  uint32 length = 4;         // bytes
  uint64 cycle_us = 5;       // GenMsgCycleTime; 0: not given
  repeated DbcSignalView signals = 6;
}

message DbcSignalView {
  string name = 1;
  uint32 start_bit = 2;      // as the DBC numbers bits; big endian: the most significant bit
  uint32 length = 3;
  bool big_endian = 4;       // Motorola (@0); otherwise Intel (@1)
  bool is_signed = 5;
  double scale = 6;          // physical = raw * scale + offset
  double offset = 7;
  string unit = 8;
  optional double minimum = 9;   // absent: the DBC gives no range
  optional double maximum = 10;
}
