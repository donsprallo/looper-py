<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img">
<title>A virtual clock held between the steps a test lets pass</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="379" rx="12" fill="#ffffff" stroke="#d7dbe4"/>
<line x1="90" y1="280" x2="900" y2="280" stroke="#5f6879" stroke-width="1.5"/>
<line x1="90" y1="280" x2="90" y2="50" stroke="#5f6879" stroke-width="1.5"/>
<text x="495.0" y="346" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6879" font-weight="normal" text-anchor="middle">wall clock: what the test is doing  -&gt;</text>
<text x="76" y="36" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6879" font-weight="normal" text-anchor="start">simulated time</text>
