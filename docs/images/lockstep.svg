<rect x="120" y="66" width="300" height="52" rx="8" fill="#ffffff" stroke="#d7dbe4" stroke-width="1"/>
<line x1="134" y1="84" x2="160" y2="84" stroke="#2563eb" stroke-width="3"/>
<text x="168" y="88" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b1f2a" font-weight="normal" text-anchor="start">held: the clock stands still</text>
<line x1="134" y1="104" x2="160" y2="104" stroke="#108b63" stroke-width="3"/>
<text x="168" y="108" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1b1f2a" font-weight="normal" text-anchor="start">runs: exactly the time let pass</text>
