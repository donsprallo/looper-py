<text x="515.0" y="318" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#108b63" font-weight="normal" text-anchor="middle" xml:space="preserve">evaluate(for_seconds=1.5)</text>
<rect x="560" y="50" width="200" height="230" rx="0" fill="#eef0f5" fill-opacity="0.6"/>
<line x1="560" y1="155.0" x2="760" y2="155.0" stroke="#2563eb" stroke-width="3"/>
<text x="660.0" y="298" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle">clock + counts read together</text>
<rect x="760" y="50" width="70" height="230" rx="0" fill="#d6f2e6" fill-opacity="0.6"/>
