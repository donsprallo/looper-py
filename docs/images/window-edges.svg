<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" role="img">
<title>How many toggles a window catches depends on where it starts</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="259" rx="12" fill="#ffffff" stroke="#d7dbe4"/>
<line x1="60" y1="120" x2="900" y2="120" stroke="#5f6879" stroke-width="1.5"/>
<line x1="60.0" y1="116" x2="60.0" y2="124" stroke="#5f6879" stroke-width="1.5"/>
<text x="60.0" y="140" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle" xml:space="preserve">0 s</text>
<line x1="260.0" y1="116" x2="260.0" y2="124" stroke="#5f6879" stroke-width="1.5"/>
<text x="260.0" y="140" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle" xml:space="preserve">1 s</text>
<line x1="460.0" y1="116" x2="460.0" y2="124" stroke="#5f6879" stroke-width="1.5"/>
<text x="460.0" y="140" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle" xml:space="preserve">2 s</text>
<line x1="660.0" y1="116" x2="660.0" y2="124" stroke="#5f6879" stroke-width="1.5"/>
<text x="660.0" y="140" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle" xml:space="preserve">3 s</text>
<line x1="860.0" y1="116" x2="860.0" y2="124" stroke="#5f6879" stroke-width="1.5"/>
<text x="860.0" y="140" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#5f6879" font-weight="normal" text-anchor="middle" xml:space="preserve">4 s</text>
<circle cx="160.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="260.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="360.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="460.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="560.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="660.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="760.0" cy="120" r="6" fill="#2563eb"/>
<circle cx="860.0" cy="120" r="6" fill="#2563eb"/>
<text x="60" y="52" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1f2a" font-weight="bold" text-anchor="start">the LED toggles every 500 ms (2 Hz)</text>
<rect x="60.0" y="146" width="400.0" height="22" rx="6" fill="#fdecc8" stroke="#b57d09" stroke-width="1"/>
<text x="470.0" y="162" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#b57d09" font-weight="normal" text-anchor="start">window 0 .. 2 000 000 us (end excluded) catches 3 toggles: 1.5 Hz</text>
<rect x="110.0" y="186" width="400.0" height="22" rx="6" fill="#d6f2e6" stroke="#108b63" stroke-width="1"/>
<text x="520.0" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#108b63" font-weight="normal" text-anchor="start">window 250 000 .. 2 250 000 us catches 4 toggles: 2 Hz</text>
</svg>
