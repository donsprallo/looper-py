<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img">
<title>An expectation counts the resets inside its window</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="299" rx="12" fill="#ffffff" stroke="#d7dbe4"/>
<text x="70" y="30" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1f2a" font-weight="bold" text-anchor="start">evaluate(for_seconds=0.15) at 20 ms, with STOP_KICKING set: the window is 20 ms to 170 ms</text>
<rect x="165.29411764705884" y="46" width="714.7058823529412" height="26" rx="6" fill="#dbe7ff" stroke="#2563eb" stroke-width="1"/>
<text x="175.29411764705884" y="64" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="start">the window: resets of this span are counted</text>
<line x1="70" y1="150" x2="880" y2="150" stroke="#5f6879" stroke-width="1"/>
<line x1="70.0" y1="146" x2="70.0" y2="154" stroke="#5f6879" stroke-width="1"/>
<text x="70.0" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5f6879" font-weight="normal" text-anchor="middle">0 ms</text>
<line x1="308.2352941176471" y1="146" x2="308.2352941176471" y2="154" stroke="#5f6879" stroke-width="1"/>
<text x="308.2352941176471" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5f6879" font-weight="normal" text-anchor="middle">50 ms</text>
<line x1="546.4705882352941" y1="146" x2="546.4705882352941" y2="154" stroke="#5f6879" stroke-width="1"/>
<text x="546.4705882352941" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5f6879" font-weight="normal" text-anchor="middle">100 ms</text>
<line x1="784.7058823529411" y1="146" x2="784.7058823529411" y2="154" stroke="#5f6879" stroke-width="1"/>
<text x="784.7058823529411" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5f6879" font-weight="normal" text-anchor="middle">150 ms</text>
<rect x="70" y="114" width="562.8088235294117" height="28" rx="5" fill="#d6f2e6" stroke="#108b63" stroke-width="1"/>
<text x="80" y="133" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1f2a" font-weight="bold" text-anchor="start">life 1</text>
<rect x="638.8088235294117" y="114" width="241.1911764705883" height="28" rx="5" fill="#d6f2e6" stroke="#108b63" stroke-width="1"/>
<text x="647.8088235294117" y="133" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1f2a" font-weight="bold" text-anchor="start">life 2</text>
<line x1="634.8088235294117" y1="98" x2="634.8088235294117" y2="158" stroke="#c93b3b" stroke-width="1.5"/>
<line x1="636.8088235294117" y1="98" x2="636.8088235294117" y2="158" stroke="#c93b3b" stroke-width="1.5"/>
<text x="635.8088235294117" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c93b3b" font-weight="bold" text-anchor="middle">reset, cause watchdog</text>
<text x="70" y="214" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#1b1f2a" font-weight="normal" text-anchor="start" xml:space="preserve">check.reset(cause="watchdog").happened_once()</text>
<text x="70" y="234" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#108b63" font-weight="normal" text-anchor="start" xml:space="preserve">ok    watchdog reset: expected once, saw watchdog at 0.118750 s</text>
<text x="70" y="262" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6879" font-weight="normal" text-anchor="start">A reset before the window or after it is not counted; the lives of the run are simulation.lives().</text>
</svg>
